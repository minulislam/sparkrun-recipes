# >>> UNVERIFIED — first TP=2 boot of Inkling-Small NVFP4 under vLLM with runtime refusal dial.
# >>> Serves STOCK thinkingmachines/Inkling-Small-NVFP4 (276B MoE / 12B active, 42 layers).
# >>> Ablation is rank-1 refusal directions applied at runtime; lambda=0 is bit-exact to stock.
# >>> Turn dial on/off live via POST /admin/refusal_lambda.
# >>> Requires TP=2 across 2x DGX Spark nodes (gb10-spark 10.10.20.10 + gx10-spark 10.10.20.11).

recipe_version: "2"
model: thinkingmachines/Inkling-Small-NVFP4
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-b12x:20260926
min_nodes: 2
max_nodes: 2

executor_config:
  entrypoint: ""

readiness:
  port_timeout_s: 1800
  health_timeout_s: 1800
  inference_timeout_s: 600

metadata:
  description: >-
    Thinking Machines Inkling-Small NVFP4 via vLLM with runtime rank-1 refusal projection.
    Stock weights, 42 layer directions, lambda switchable without restart over HTTP.
  model_params: 276B
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4
  model_vram: 170

mods:
  - mods/inkling-refusal-dial

env:
  VLLM_REFUSAL_DIRS: /opt/refusal/refusal_dirs_inkling.safetensors
  VLLM_REFUSAL_LAMBDA_INIT: "1.0"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  served_model_name: inkling-small

pre_exec:
  - python3 /opt/refusal/verify_inkling_rank1.py

post_exec:
  - curl -s localhost:{port}/v1/models
  - 'curl -s -XPOST localhost:{port}/admin/refusal_lambda -H ''Content-Type: application/json'' -d ''{{"lambda": 1}}'''
  - curl -s localhost:{port}/admin/refusal_lambda

post_commands:
  - 'echo "ablation on:  curl -XPOST {head_host}:{port}/admin/refusal_lambda -d ''{{\"lambda\": 1}}''"'
  - 'echo "ablation off: curl -XPOST {head_host}:{port}/admin/refusal_lambda -d ''{{\"lambda\": 0}}''"'

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    -tp {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --trust-remote-code \
    --enable-prefix-caching
