# >>> Please test and run --dry-run first, then update with your verified launch facts.

# =============================================================================
# sparkrun recipe — GLM-5.2 NVFP4+AQLM   [MiaAI-Lab]
# THREE NODES (TP=3 / 3 GPUs) on DGX Spark GB10.
# -----------------------------------------------------------------------------
# Model: Mia-AiLab/GLM-5.2-NVFP4-AQLM
# Source: https://github.com/MiaAI-Lab/GLM-5.2-NVFP4-AQLM-Triple-DGX-Sparks
# Container: ghcr.io/miaai-lab/glm-5.2-nvfp4-triple-dgx-sparks:latest
# Runtime: vLLM (Ray) | Context: 380k
# Notes: Multimodal, 380k context with MTP
# =============================================================================

recipe_version: "2"
model: Mia-AiLab/GLM-5.2-NVFP4-AQLM
runtime: vllm
container: ghcr.io/miaai-lab/glm-5.2-nvfp4-triple-dgx-sparks:latest
min_nodes: 3
max_nodes: 3

metadata:
  description: >-
    GLM-5.2 NVFP4+AQLM on 3x DGX Spark — multimodal, 380k context with MTP.
    Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 200B
  model_dtype: nvfp4
  quantization: aqlm
  quant_bits: 4

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 3
  gpu_memory_utilization: 0.90
  max_model_len: 380000
  served_model_name: glm-5.2-nvfp4-aqlm
  enforce_eager: true

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --trust-remote-code
