# >>> Please test and run --dry-run first, then update with your verified launch facts.

# =============================================================================
# sparkrun recipe — Meta Muse Glimmer 30B NVFP4   [MiaAI-Lab]
# SINGLE NODE (TP=1 / 1 GPU) on DGX Spark GB10.
# -----------------------------------------------------------------------------
# Model: RedHatAI/Muse-Glimmer-30B-NVFP4 (W4A4 variant)
# Source: https://github.com/MiaAI-Lab/Muse-Glimmer-30B-DGX-Spark-RTX-5090-6000-PRO
# Runtime: vLLM | Context: 256k
# Notes: W4A4 variant, vision intact
# =============================================================================

model: RedHatAI/Muse-Glimmer-30B-NVFP4
runtime: vllm
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    Meta Muse Glimmer 30B NVFP4 W4A4 variant on single DGX Spark /
    RTX 5090 / RTX 6000 PRO. 256k context.
    Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 30B
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.90
  max_model_len: 262144
  served_model_name: muse-glimmer-30b

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --trust-remote-code
