# >>> UNVERIFIED on this cluster — expert-parallel variant of deepseek-v4-flash-vision-uncensored-tp2.yaml.
# >>>   See that file for the gate, entrypoint, KV-dtype, batch-cap and fit notes; everything here is
# >>>   identical except --enable-expert-parallel: each node holds whole experts for half of the
# >>>   256-expert set (EP=2 for the MoE layers) instead of half of every expert. Attention stays TP2
# >>>   and the weights are still ~84 GB/node; only the MoE communication/kernel pattern changes.
# >>> Separate file because sparkrun has no -o key for a bare boolean vLLM flag and drops arguments
# >>>   passed after `--`. Precedent on 2 Sparks: the @community qwen3.8-flash-next t4cmyk recipes.
# >>> vLLM's default all2all backend (allgather_reducescatter, plain NCCL — no DeepEP on GB10) is
# >>>   used; if MoE dispatch misbehaves, add `--all2all-backend naive` to the command.

recipe_version: "2"
model: orcarouter/DeepSeek-V4-Flash-Vision-Uncensored
model_revision: 2ef3d5c2bb7d9ccba6ab66314ed9e63bd52ac2a6   # HF commit as of 2026-09-03
runtime: vllm
container: ghcr.io/anemll/dspark-vllm-gx10:0.1.1
min_nodes: 2
max_nodes: 2

executor_config:
  entrypoint: ""

metadata:
  description: >-
    DeepSeek V4 Flash Vision uncensored/abliterated (orcarouter), native FP4 experts / FP8 rest.
    Two DGX Sparks: tensor-parallel 2 with expert parallelism enabled (EP=2 for the MoE layers).
  maintainer: orcarouter (model) — recipe adapted for sparkrun
  model_dtype: fp4
  model_vram: 168

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 2
  gpu_memory_utilization: 0.82
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  kv_cache_dtype: fp8
  served_model_name: deepseek-v4-flash-vision-uncensored

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --enable-expert-parallel \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype {kv_cache_dtype} \
    --trust-remote-code
