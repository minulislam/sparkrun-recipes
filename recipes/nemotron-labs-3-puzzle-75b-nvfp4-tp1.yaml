# sparkrun recipe: NVIDIA Nemotron-Labs-3-Puzzle-75B-A9B-NVFP4 via vLLM on single DGX Spark (TP=1)
# Source: https://github.com/MiaAI-Lab/Nemotron-Labs-3-Puzzle-75B-DGX-Spark
model: nvidia/NVIDIA-Nemotron-Labs-3-Puzzle-75B-A9B-NVFP4
runtime: vllm
container: vllm/vllm-openai:v0.24.0
min_nodes: 1
max_nodes: 1
metadata:
  description: "NVIDIA Nemotron-Labs-3-Puzzle-75B hybrid MoE (Mamba+MoE+Attention) NVFP4 on single DGX Spark — 256k ctx, MTP k=3, tool calling"
  category: general
  model_params: 75300000000
  model_dtype: nvfp4
  kv_dtype: fp8_e5m2
  quantization: nvfp4
  quant_bits: 4
defaults:
  port: 8888
  tensor_parallel: 1
  gpu_memory_utilization: 0.9
  max_model_len: 262144
