# >>> Please test and run --dry-run first, then update with your verified launch facts.

# =============================================================================
# sparkrun recipe — NVIDIA Nemotron-Labs-3-Puzzle-75B-A9B-NVFP4   [MiaAI-Lab]
# SINGLE NODE (TP=1 / 1 GPU) on DGX Spark GB10.
# -----------------------------------------------------------------------------
# Model: nvidia/NVIDIA-Nemotron-Labs-3-Puzzle-75B-A9B-NVFP4
# Source: https://github.com/MiaAI-Lab/Nemotron-Labs-3-Puzzle-75B-DGX-Spark
# Container: vllm/vllm-openai:v0.24.0
# Runtime: vLLM | Context: 256k
# Notes: Hybrid MoE (Mamba+MoE+Attention), MTP k=3, tool calling
# =============================================================================

model: nvidia/NVIDIA-Nemotron-Labs-3-Puzzle-75B-A9B-NVFP4
runtime: vllm
container: vllm/vllm-openai:v0.24.0
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    NVIDIA Nemotron-Labs-3-Puzzle-75B hybrid MoE (Mamba+MoE+Attention) NVFP4
    on single DGX Spark — 256k ctx, MTP k=3, tool calling.
    Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 75B
  model_dtype: nvfp4
  kv_dtype: fp8_e5m2
  quantization: nvfp4
  quant_bits: 4

env:
  HF_TOKEN: "${HF_TOKEN:-}"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.90
  max_model_len: 262144
  served_model_name: nemotron-labs-3-puzzle-75b

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --trust-remote-code
