# >>> UNVERIFIED — source: https://github.com/MiaAI-Lab/Dual-DGX-Spark-Step-3.7-Flash-NVFP4
# >>> Please test and run --dry-run first, then update with your verified launch facts.

# =============================================================================
# sparkrun recipe — Step-3.7-Flash NVFP4   [MiaAI-Lab]
# TWO NODES (TP=2 / 2 GPUs) on DGX Spark GB10.
# -----------------------------------------------------------------------------
# Model: stepfun-ai/Step-3.7-Flash-NVFP4
# Source: https://github.com/MiaAI-Lab/Dual-DGX-Spark-Step-3.7-Flash-NVFP4
# Container: Build via Dockerfile.stepfun37-workspace in the source repo
# Runtime: vLLM | Context: varies
# Notes: Custom Dockerfile; supports MTP grafting. Verify no-MTP mode first
#   before debugging MTP. Worker node needs ~124 GB weight transfer on first launch.
# =============================================================================

model: stepfun-ai/Step-3.7-Flash-NVFP4
runtime: vllm
min_nodes: 2
max_nodes: 2

metadata:
  description: >-
    stepfun-ai/Step-3.7-Flash-NVFP4 on 2x DGX Spark via vLLM.
    Custom container from MiaAI-Lab source repo. Supports MTP grafting.
    Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 198B
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4

env:
  HF_TOKEN: "${HF_TOKEN:-}"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 2
  gpu_memory_utilization: 0.80
  served_model_name: step-3.7-flash

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --trust-remote-code
