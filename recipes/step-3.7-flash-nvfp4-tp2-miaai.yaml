# >>> FIRST-BOOT PREP 2026-10-01 (spark-forge). Source: MiaAI-Lab
# >>> https://github.com/MiaAI-Lab/Dual-DGX-Spark-Step-3.7-Flash-NVFP4 (cloned at 11b9a41).
# >>> This recipe shipped with NO `container:` field at all, so it could never launch — sparkrun
# >>> validated it only because the field is optional. Upstream builds a wrapper image from
# >>> Dockerfile.stepfun37-workspace, but that Dockerfile adds nothing except `mkdir /workspace`
# >>> + WORKDIR, so the base image is named directly here and the wrapper build is skipped.
# >>>
# >>> LOCAL CHANGES vs the upstream scripts (four, each with a reason):
# >>>   1. container: vllm/vllm-openai:stepfun37 — the base image upstream's Dockerfile wraps.
# >>>      arm64 manifest sha256:00417ffbb7db2c9b0c, 10.19 GB, pushed 2026-05-28; pulled on BOTH
# >>>      nodes 2026-10-01. A named non-date tag, so it can move — the only tag upstream offers.
# >>>   2. max_model_len 65536 for the first boot. Native max is 262144 (config.json
# >>>      max_position_embeddings) and upstream's config.env.example uses it, but this model has
# >>>      never booted on this pair. Ladder up only after a coherence pass at 64k.
# >>>   3. max_num_batched_tokens: 2048. Unbounded chunked prefill at depth is the measured
# >>>      node-killer on this pair (DeepSeek coder livelocked the worker twice at 8192, and
# >>>      upstream's config.env.example defaults to 8192). 2048 is the value two recipes here
# >>>      verified clean.
# >>>   4. readiness: 1800/1800/600 — 129.3 GB of weights, so the cold load is long.
# >>>
# >>> DELIBERATELY NOT SET: no NCCL env. The f1 HCA pin, GID index 3 and the socket trio are
# >>> cluster state in ~/.config/sparkrun/clusters/dgx-pair.yaml, not recipe state, and the
# >>> validator warns on recipe-level NCCL_IB_HCA. Note upstream's config.env.example ships
# >>> NCCL_IB_GID_INDEX=0, which is WRONG for this pair — our GID tables are aligned to index 3.
# >>>
# >>> MODEL FACTS read from the downloaded config.json: model_type step3p7,
# >>> Step3p7ForConditionalGeneration (TEXT + VISION), 48 layers, NVFP4 weights with FP8 KV.
# >>> Layers 45-47, the vision tower and the projector are EXCLUDED from quantisation, i.e. bf16
# >>> in the unified pool — the same shape of cost that made qwen3.8-flash-next-uncensored UNFIT
# >>> here, so watch per-rank memory on the first load.
# >>>
# >>> Verify no-MTP mode (this file) before touching upstream's MTP grafting path.
# >>>   5. executor_config.entrypoint: "" — the image bakes ENTRYPOINT ["vllm","serve"], which
# >>>      eats sparkrun's appended command. First launch attempt died on this; same fix five
# >>>      other recipes here already carry (commit 52d342d).
# >>>
# >>> ===========================================================================
# >>> LAUNCHED AND MEASURED 2026-10-01 — first boot ever. Two findings, one good, one blocking.
# >>>
# >>> FINDING 1 — COHERENT. This build answers correctly. The exact prompt that returned
# >>> `" order 8 3 "` noise on step37-flash-aeon-abliterated (confirmed garbage three times,
# >>> 2026-09-27/28/29) answered properly here: "Name three primary colors" produced correct
# >>> colour-theory prose, and "capital of France" returned Paris. So the garbage was a property
# >>> of the AEON ABLITERATED QUANT, not of Step-3.7, not of NVFP4, and not of this pair. That
# >>> retires the open question the AEON recipe left behind.
# >>> It is a REASONING model: it emits chain-of-thought and closes with a bare `</think>` before
# >>> the answer. No reasoning parser is set, so the thinking leaks into message.content —
# >>> add `--reasoning-parser` before exposing this to clients.
# >>>
# >>> FINDING 2 — UNSTABLE AT TP=2, THE BLOCKER. The engine died after 2 requests / 196 generated
# >>> tokens. Sequence: decode ran at ~10 tok/s, then throughput fell to 0 with 1 request still
# >>> resident, then five rounds of `shm_broadcast: No available shared memory broadcast block
# >>> found in 60 seconds`, then `TimeoutError: RPC call to sample_tokens timed out` ->
# >>> `EngineDeadError`. The worker rank stopped answering the sampler RPC. The API server went
# >>> fully dead (connection refused) while BOTH containers still reported "Up" — a wedged zombie
# >>> that `sparkrun stop` cleared normally.
# >>> This is the SAME failure class the AEON build hit ("worker shm-broadcast TimeoutError, hung
# >>> collective"). So the earlier conclusion that "the AEON image's TP=2 path is broken" is too
# >>> narrow: the official vllm/vllm-openai:stepfun37 image hangs the same way. The Step-3.7 TP=2
# >>> path is broken on this pair, independent of the quant. Note the image is from 2026-05-28
# >>> (vllm 0.1.dev16944+ge9c8946e7) and upstream publishes no newer stepfun37 tag.
# >>> Mitigations already spent on the AEON build and NOT worth repeating blind: --enforce-eager,
# >>> bf16 KV, NCCL forced to TCP sockets. All three still hung.
# >>>
# >>> MEASURED (head rank, util 0.80, max_model_len 65536):
# >>>   weights 58.4 GiB/rank — identical to the AEON build's 58.4 GiB/node
# >>>   weight load 164.4 s; model load 172.0 s; init engine 82.35 s (compile 30.85 s)
# >>>   CUDA graphs captured fine: 15 s, 1.74 GiB (so graphs are NOT the problem)
# >>>   KV cache 30.65 GiB = 2,395,878 tokens, 36.56x concurrency at 65,536
# >>>   decode ~10 tok/s single stream before the hang
# >>>   launch wall 342.5 s including the 129 GB worker weight sync over cx7
# >>>
# >>> STATUS: serves coherently, then wedges. DO NOT put this in a serving rotation. Next
# >>> experiment, if anyone wants it: a newer vLLM against this checkpoint, since the hang is in
# >>> the TP=2 sampler RPC and the image predates six months of fixes. Weights are on BOTH nodes
# >>> now (129.2 GB, blobs hardlinked), so a retry costs only the boot.
# >>> ===========================================================================
# =============================================================================
# sparkrun recipe — Step-3.7-Flash NVFP4   [MiaAI-Lab, no-MTP]
# TWO NODES (TP=2 / 2 GPUs) on DGX Spark GB10.
# =============================================================================

recipe_version: "2"
model: stepfun-ai/Step-3.7-Flash-NVFP4
runtime: vllm
container: vllm/vllm-openai:stepfun37  # base image of upstream's wrapper Dockerfile; pulled both nodes 2026-10-01
# The image declares ENTRYPOINT ["vllm","serve"], which consumes the command sparkrun appends
# instead of running it, so the workload never starts. Clearing it lets sparkrun run its own
# composed `vllm serve` directly. MEASURED 2026-10-01: first launch failed on exactly this.
executor_config:
  entrypoint: ""
min_nodes: 2
max_nodes: 2

metadata:
  description: >-
    stepfun-ai/Step-3.7-Flash-NVFP4 on 2x DGX Spark via vLLM, no-MTP mode.
    198B MoE, NVFP4 weights, FP8 KV, text + vision. Source-validated by
    MiaAI-Lab; not yet verified on this pair.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab); spark-forge local prep
  model_params: 198B
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4
  kv_dtype: fp8
  category: general

readiness:
  port_timeout_s: 1800
  health_timeout_s: 1800
  inference_timeout_s: 600

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 2
  gpu_memory_utilization: 0.80
  max_model_len: 65536
  max_num_batched_tokens: 2048
  served_model_name: step-3.7-flash

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code
