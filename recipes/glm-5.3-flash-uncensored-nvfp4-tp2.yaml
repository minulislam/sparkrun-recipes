# =============================================================================
# sparkrun recipe — GLM-5.3-Flash-Uncensored-NVFP4
# TWO NODES (TP=2) on DGX Spark GB10.
# Model: orcarouter/GLM-5.3-Flash-Uncensored-NVFP4  (205.1 GB of weights)
# Runtime: vllm-ray | Container: mia/glm53-flash-spark:mm-ray-v1
# =============================================================================

model: orcarouter/GLM-5.3-Flash-Uncensored-NVFP4
model_revision: ec0adf4f49c9570807cc11a5f650538c1893ae54   # HF commit as of 2026-09-07
runtime: vllm-ray
container: mia/glm53-flash-spark:mm-ray-v1
min_nodes: 2
max_nodes: 2

metadata:
  description: >-
    GLM 5.3 Flash uncensored/abliterated, NVFP4, vision-capable. Ray-orchestrated
    tensor-parallel over 2 Sparks. SEE THE FIT WARNING - this one is marginal.
  maintainer: orcarouter (model) — recipe adapted for sparkrun
  model_dtype: nvfp4
  model_vram: 205

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 2
  gpu_memory_utilization: 0.86
  max_model_len: 32768
  served_model_name: glm-5.3-flash-uncensored

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --trust-remote-code
