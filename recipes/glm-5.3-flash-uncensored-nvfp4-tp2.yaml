# >>> UNVERIFIED on this cluster — source: https://huggingface.co/orcarouter/GLM-5.3-Flash-Uncensored-NVFP4
# >>> GATED — the HF account behind the token must have accepted the repo gate (see INDEX.md, orcarouter note).
# >>> env + flags mirror @eugr/glm-5.3-flash (the config that boots the stock GLM-5.3-Flash NVFP4 Spark
# >>>   build on this pair), except --quantization is left to auto-detect: orcarouter ships
# >>>   compressed-tensors NVFP4, not the modelopt_mixed format eugr's flag targets. If the b12x
# >>>   backends reject it: -o moe_backend=auto -o linear_backend=auto
# >>> FIT WARNING: 205.1 GB / 2 = ~103 GB per node against a 0.87 budget of 105 GB — almost no room
# >>>   for KV cache; expect KV allocation to fail unless max_model_len is tiny. The 175 GB "-Spark"
# >>>   NVFP4 build is the one that fits comfortably.

model: orcarouter/GLM-5.3-Flash-Uncensored-NVFP4
model_revision: ec0adf4f49c9570807cc11a5f650538c1893ae54   # HF commit as of 2026-09-07
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-b12x:latest
min_nodes: 2
max_nodes: 2

metadata:
  description: >-
    GLM 5.3 Flash uncensored/abliterated (orcarouter), NVFP4, vision-capable.
    Tensor-parallel across both DGX Sparks. SEE THE FIT WARNING - marginal.
  maintainer: orcarouter (model) — recipe adapted for sparkrun
  model_dtype: nvfp4
  model_vram: 205

env:
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  VLLM_ENABLE_PCIE_ALLREDUCE: "0"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  INSTANTTENSOR_BACKEND: "BUFFERED"
  INSTANTTENSOR_BUFFER_SIZE: "67108864"
  INSTANTTENSOR_CHUNK_SIZE: "8388608"
  INSTANTTENSOR_CONCURRENCY: "1"
  INSTANTTENSOR_IO_DEPTH: "3"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 2
  gpu_memory_utilization: 0.87
  max_model_len: 32768
  max_num_seqs: 4
  kv_cache_dtype: fp8
  max_num_batched_tokens: 4096
  block_size: 256
  moe_backend: b12x
  linear_backend: b12x
  num_speculative_tokens: 5
  served_model_name: glm-5.3-flash-uncensored

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype {kv_cache_dtype} \
    --attention-backend B12X \
    --block-size {block_size} \
    --moe-backend {moe_backend} \
    --linear-backend {linear_backend} \
    --no-enable-flashinfer-autotune \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"moe_backend":"humming","attention_backend":"B12X"}' \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --trust-remote-code
