# =============================================================================
# sparkrun recipe — Nex-N2.5-mini-Uncensored-NVFP4
# SINGLE NODE (TP=1) on DGX Spark GB10.
# Model: orcarouter/Nex-N2.5-mini-Uncensored-NVFP4  (23.9 GB of weights)
# Runtime: vllm | Container: vllm/vllm-openai:v0.24.0
# =============================================================================

model: orcarouter/Nex-N2.5-mini-Uncensored-NVFP4
model_revision: 1bd4586761a8077d563ab96661838e583ef5887c   # HF commit as of 2026-09-15
runtime: vllm
container: vllm/vllm-openai:v0.24.0
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    Nex-N2.5 mini uncensored/abliterated MoE, NVFP4 compressed-tensors,
    vision-capable. Single DGX Spark.
  maintainer: orcarouter (model) — recipe adapted for sparkrun
  model_dtype: nvfp4
  model_vram: 24

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.82
  max_model_len: 262144
  served_model_name: nex-n2.5-mini-uncensored

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --trust-remote-code
