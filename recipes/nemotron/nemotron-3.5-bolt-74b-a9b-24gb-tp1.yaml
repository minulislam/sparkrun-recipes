# >>>     IQ2_XXS in modelopt.py, modelopt_iq2_xs.py and fused_moe/b12x.py, and registers NemotronH_Omni.
# >>>   - b12x linear + MoE backends, FlashInfer attention and mamba, bf16 mamba caches, align mode,
