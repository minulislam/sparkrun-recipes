# >>>   1414 s, mostly one-time flashinfer JIT); 17*23=391 with reasoning split out by ultra_v3;
# >>>   qwen3_coder tool call correct; c=1 decode 36.4 tok/s end-to-end (1024 tokens / 28.1 s).
# >>> NO DFlash: this image rejects the LiLiCorr drafter ("Model architectures ['LiLiCorrDraftModel']
# >>>   are not supported"), and the 20260927 image that accepts it has no IQ2_XXS. Add the
# >>>   speculative-config back (model card: dflash, 7 tokens, standard rejection, FLASHINFER) once
# >>>   one image has both.
# >>> 2026-11-17 and 2026-11-25 boots on the spark-arena 20260927 image died with
# >>>   NV_ERR_NO_MEMORY while loading weights (2026-11-25 with the head to itself: host used
# >>>   118/121 GiB). Root cause: that image's vLLM has no IQ2_XXS (ggml 2-bit) support for the
# >>>   modelopt MIXED_PRECISION experts, so the 22 GiB checkpoint cannot load in place.
