recipe_version: "2"
model: nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB
model_revision: e0590ed2f3a564fd99725d9d891cb09deb7cc201
runtime: vllm
min_nodes: 1
max_nodes: 1
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-b12x:2026112501

metadata:
  description: NVIDIA Nemotron 3.5 Bolt 74B-A9B 24GB on one DGX Spark, b12x IQ2 kernels (no speculative decoding yet)
  maintainer: NVIDIA (model card Quick Start) / vcruz305 (one-Spark profile) — adapted for this cluster

env:
  VLLM_USE_V2_MODEL_RUNNER: "1"

defaults:
  kv_cache_dtype: fp8
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.55
  max_model_len: 262144
  max_num_seqs: 8
  served_model_name: nemotron-3.5-bolt

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --load-format auto \
    --tensor-parallel-size {tensor_parallel} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --enable-chunked-prefill \
    --kv-cache-dtype {kv_cache_dtype} \
    --linear-backend b12x \
    --moe-backend b12x \
    --attention-backend FLASHINFER \
    --mamba-backend flashinfer \
    --mamba-ssm-cache-dtype bfloat16 \
    --mamba-cache-dtype bfloat16 \
    --mamba-cache-mode align \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --limit-mm-per-prompt.image 1 \
    --limit-mm-per-prompt.video 0 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser-plugin /cache/huggingface/hub/models--nvidia--NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB/snapshots/{model_revision}/ultra_v3_reasoning_parser.py \
    --reasoning-parser ultra_v3 \
    --seed 42
