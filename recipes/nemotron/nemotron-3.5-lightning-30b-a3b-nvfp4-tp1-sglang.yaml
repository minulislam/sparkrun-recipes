# =============================================================================
# sparkrun recipe — NVIDIA Nemotron 3.5 Lightning 30B-A3B NVFP4 via SGLang   [MiaAI-Lab]
# SINGLE NODE (TP=1 / 1 GPU) on DGX Spark GB10.
# -----------------------------------------------------------------------------
# Model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
# Source: https://github.com/MiaAI-Lab/Nemotron3.5-Lightning-DGX-Spark-RTX-5090-6000-PRO
# Container: lmsysorg/sglang:dev-nemotron3-5-lightning
# Runtime: SGLang | Context: 256k
# Notes: DSpark speculative decoding, RTX 5090/6000 PRO variant
# =============================================================================

recipe_version: "2"
model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
model_revision: bee7596271d1495f6992ae224aefde4410e816b8
runtime: sglang
container: lmsysorg/sglang:dev-nemotron3-5-lightning
# The image bakes ENTRYPOINT ["/opt/nvidia/nvidia_entrypoint.sh"]; sparkrun's run-then-exec model needs it blank.
executor_config:
  entrypoint: ""
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    NVIDIA Nemotron 3.5 Lightning 30B-A3B NVFP4 + DSpark via SGLang on
    DGX Spark / RTX 5090 / RTX 6000 PRO. 1M context (verified on GB10).
    Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 30B
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.82
  max_model_len: 1048576
  served_model_name: nemotron-3.5-lightning

command: |
  sglang serve \
    --model-path {model} \
    --revision {model_revision} \
    --host {host} \
    --port {port} \
    --tp {tensor_parallel} \
    --context-length {max_model_len} \
    --mem-fraction-static {gpu_memory_utilization} \
    --trust-remote-code
