# >>> COPY of @experimental/nemotron-3-nano-nvfp4-vllm (eugr conversion) (fetched 2026-09-27, per user request: include registry recipes for
# >>> models whose weights are on dgx-pair). Source content unchanged except where noted.
recipe_version: "2"
model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
model_revision: 6efb4a2a1c1fa277ce7b3df7a1416255011b1c99
runtime: vllm
max_nodes: 1
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:20260927  # pinned from :latest 2026-09-28 — build already on disk, verified live

metadata:
  description: Nemotron-3-Nano NVFP4 — single node only

mods:
  - mods/nemotron-nano

defaults:
  kv_cache_dtype: fp8
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.7
  max_model_len: 262144
  load_format: fastsafetensors
  tool_call_parser: qwen3_coder
  reasoning_parser: nano_v3

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --moe-backend cutlass \
    --max-model-len {max_model_len} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser-plugin nano_v3_reasoning_parser.py \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --enable-prefix-caching \
    --load-format {load_format} \
    --gpu-memory-utilization {gpu_memory_utilization}