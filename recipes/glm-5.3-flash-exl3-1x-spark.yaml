# >>>   util 0.85 -> 102.8 GiB budget, 6.8 GiB left for KV = 157,286 max context tokens.
# >>>              The planner WARNS: 262,144 does not fit, only 60% of it.
# >>>   util 0.95 -> 18.8 GiB for KV = 439,236 max context tokens, so the advertised 262,144 fits
# >>>              with 1.7x headroom. MEASURED, not estimated.
# >>> So 0.95 is REQUIRED for the headline 262k feature; it is not padding. Kept at upstream's 0.95
# >>> for that reason, but understand the risk: margin history on this pair is unforgiving — step37
# >>> aborted pre-load at 0.88 (free 106.29 < 107.09 GiB) and 0.82 is the value two TP2 recipes
