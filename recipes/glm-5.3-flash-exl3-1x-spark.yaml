# >>> Two planner warnings still apply: the MLA estimate counts only the compressed latent cache,
# >>> excluding the RoPE tail and the sparse-indexer cache, so the real KV need is HIGHER than the
# >>> 11.25 GiB modelled. The 1.7x headroom at 262k should absorb that, but read the achieved
# >>> max_model_len back from the server on first launch rather than trusting this.
