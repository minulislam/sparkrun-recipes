recipe_version: "2"
model: 0xSero/GLM-5.3-Flash-EXL3-Spark
runtime: sglang
# container: UNRESOLVED — upstream's ghcr.io/miaai-lab/sglang-exl3:latest does not exist (403).
#   Candidates to try, both pullable and already used by row 32:
#     ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks:exl3
#     ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks:exl3-instanttensor
#   Both are built for the 2x-Spark layout, so neither is known to work at tp=1. Resolve with the
#   publisher, pin an immutable tag, then delete this comment and set `container:` below.
container: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks:exl3  # PROVISIONAL — see note above
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    GLM-5.3-Flash EXL3 on a single DGX Spark, 262k context, native MTP.
    Upstream recipe by 0xSero; translated and annotated for this cluster.
  maintainer: 0xSero (upstream); spark-forge translation
  model_params: 48B      # upstream figure; see banner — likely ACTIVE params, not total
  model_dtype: int4   # EXL3 ~2bpw; 'exl3' is not a dtype sparkrun recognises
  quantization: exl3
  model_vram: 96.1       # verified: actual HF repo size

env:
  HF_HUB_ENABLE_HF_TRANSFER: "1"
  SGLANG_ENABLE_CUDA_GRAPH: "1"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.95   # upstream value, REQUIRED for 262k context — see banner
  max_model_len: 262144
  served_model_name: GLM-5.3-Flash-EXL3

command: |
  python3 -m sglang.launch_server \
    --model-path {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tp {tensor_parallel} \
    --mem-fraction-static {gpu_memory_utilization} \
    --context-length {max_model_len} \
    --trust-remote-code
