# =============================================================================
# sparkrun recipe — GLM-5.3 Flash NVFP4   [MiaAI-Lab]
# TWO NODES (TP=2 / 2 GPUs) on DGX Spark GB10 via Ray.
# -----------------------------------------------------------------------------
# Model: LibertAIDAI/GLM-5.3-Flash-NVFP4 — multimodal MoE, NVFP4
# Source: https://github.com/MiaAI-Lab/GLM-5.3-Flash-NVFP4-Dual-DGX-Spark
# Container: mia/glm53-flash-spark:mm-ray-v1
# Context: 262k tokens | Runtime: Ray + vLLM | Modality: text + multimodal
# Notes: enforce_eager=true skips CUDA-graph capture on GB10 UMA.
# =============================================================================

recipe_version: "2"
model: LibertAIDAI/GLM-5.3-Flash-NVFP4
runtime: vllm-ray              # Ray-based orchestration for multi-node
container: mia/glm53-flash-spark:mm-ray-v1
min_nodes: 2
max_nodes: 2

metadata:
  description: >-
    GLM-5.3 Flash NVFP4 multimodal MoE on 2x DGX Spark — Ray TP=2, FP8 KV cache.
    262k context. Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 92B
  model_dtype: nvfp4
  kv_dtype: fp8_e5m2
  quantization: nvfp4
  quant_bits: 4

env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 2
  gpu_memory_utilization: 0.80
  max_model_len: 262144
  served_model_name: glm-5.3-flash
  enforce_eager: true       # skip CUDA-graph capture on GB10 UMA

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --trust-remote-code
