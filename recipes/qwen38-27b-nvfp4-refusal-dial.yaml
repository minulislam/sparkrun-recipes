# >>> UNVERIFIED — source: https://huggingface.co/pocharlies/qwen38-27b-uncensored-abliterated-refusal-directions
# >>> Requires container docker.io/pocharlies/vllm-qwen38-rank1:20260815 — NOT yet pulled on this
# >>> cluster, and the recipe cannot run without it (the vLLM refusal patch ships only in that image).
# >>> Placement note: defaults are tuned for a SHARED node (gpu_mem 0.35 + 8 GiB KV ~= 32 GB).
# >>> On dgx-pair, the co-tenant must be at <= 0.60 for this to fit alongside.
# >>> Please test and run --dry-run first, then update with your verified launch facts.
# >>> VERIFIED 2026-09-17 on 10.10.20.11 (image 20260815):
# >>>   GLOBAL dial WORKS. lambda=0 refuses a low-harm trigger, lambda=1 complies.
# >>>   VLLM_REFUSAL_LAMBDA_INIT is IGNORED - server always starts at 0.0. post_exec fixes it.
# >>>   PER-REQUEST cache_salt "refusal:<x>" does NOT work: the tag 20260815 predates the
# >>>   per-request feature (added upstream 2026-08-19). It is treated as a plain prefix-cache
# >>>   key, so both arms follow the GLOBAL lambda. A newer image is needed for per-request.
# >>>   Cold start needs --no-rm: the FP4 autotune outruns sparkrun's readiness probe, which
# >>>   otherwise tears the container down and reports "head container is not running".
# >>> LOCAL DIVERGENCE FROM UPSTREAM: lambda init is 1.0, not 0.0 — this pod comes up
# >>> ABLATED and requests with no cache_salt get lambda=1. Upstream ships 0.0 so a restart
# >>> never silently comes up uncensored; we opted out of that deliberately.
# >>> Flip back at runtime without restarting:
# >>>   curl -XPOST <host>:8101/admin/refusal_lambda -d '{"lambda": 0}'
# >>> lambda>0 also lowers resistance to PROMPT INJECTION — keep this endpoint off any
# >>> public ingress and do not point it at untrusted input (scraped text, inbound mail).

# sparkrun recipe — Qwen3.8-27B NVFP4 + MTP, with the refusal dial
#
#   sparkrun run qwen38-27b-nvfp4-refusal-dial.yaml
#   curl -XPOST localhost:8101/admin/refusal_lambda -d '{"lambda": 1}'   # ablation on
#   curl -XPOST localhost:8101/admin/refusal_lambda -d '{"lambda": 0}'   # off, bit-exact
#
# Serves the STOCK unsloth NVFP4 checkpoint. The ablation is 2.6 MB of rank-1 refusal
# directions applied at runtime, not baked weights — so there is no second checkpoint to
# download and lambda=0 is bit-exact to the model you pulled.
#
# The container must carry the vLLM patch from this repo (see deploy/Dockerfile). Point
# `container` at your own build; the base is whatever sm_121 vLLM 0.25.2 image you serve
# Qwen3.5-architecture models with today.
#
# Measured on one DGX Spark (GB10, 128 GB unified) with exactly these settings:
#   refusal      5/5 (lambda=0)  ->  0/5 (lambda=1)
#   throughput   20.2 / 20.4  vs  20.6 / 20.3 tok/s, alternated — no measurable cost
#                NOTE: that node's GB10 is SHARED with four other workloads, so ~20 tok/s is
#                not this model's speed on a Spark. A user on a DEDICATED Spark running this
#                exact recipe reported ~40 tok/s. The lambda comparison still holds: both
#                arms ran under identical contention, seconds apart.
#   MTP accept   2.80 median over 62 samples, max 4.00 at k=3
#   tool-calling OK in both arms

recipe_version: "2"
model: unsloth/Qwen3.8-27B-NVFP4
# Deliberately NOT pinned to a sha: Unsloth super-squashes their repos and old revisions
# (a767244d… and everything before 2026-08-15) have been 404 since then. sparkrun tracks
# `main` when no model_revision is set; a `model_revision: main` pin would make sparkrun
# download by resolved SHA with no refs/main entry, and vLLM (HF_HUB_OFFLINE=1) then dies
# with LocalEntryNotFoundError (validator: unpinned-model-revision).
runtime: vllm
min_nodes: 1
max_nodes: 1

# Pullable anonymously from Docker Hub — no login, no build step:
#   docker pull pocharlies/vllm-qwen38-rank1:20260815
# arm64 / sm_121 only (built for the GB10). Mirror, if Docker Hub rate-limits you:
#   harbor.e-dani.com/library/vllm-qwen38-rank1:20260815
# To build it yourself instead see deploy/Dockerfile — COPY-only over the public
# upstream base, so it cross-builds to arm64 from an x86 host without QEMU (~3 min).
container: docker.io/pocharlies/vllm-qwen38-rank1:20260815

# LOCAL FIX (sparkrun 0.3.8): the image bakes ENTRYPOINT ["vllm","serve"], so sparkrun's
# keep-alive (`bash -c "sleep infinity"`) is appended as ARGS to it, vLLM rejects them, the
# container exits instantly, and pre_exec then fails with the misleading
#   "Error response from daemon: No such container: sparkrun_<id>_solo"
# Blanking the entrypoint restores sparkrun's run-then-exec model. Same guard the AEON
# recipes in this registry carry. Upstream omits it; their sparkrun build did not need it.
executor_config:
  entrypoint: ""

metadata:
  description: >-
    Qwen3.8-27B NVFP4 + native MTP with runtime rank-1 refusal projection.
    Stock weights, 2.6 MB of directions, lambda switchable without restart.
  model_params: 27B
  model_dtype: nvfp4
  kv_dtype: fp8
  # ~22 GB of weights (+ 8 GiB KV at 64K via kv_cache_bytes). Comfortable on a single GB10.
  model_vram: 22

defaults:
  # NOT 8000. Reported from a real machine: something else already held 8000, so the
  # container could not bind, and the failure surfaced as an unrelated SIGKILL (exit 137)
  # in pre_exec rather than "address in use" -- because sparkrun leaves the previous
  # container RUNNING when it gives up (sys.exit(1) with no teardown), and cluster_id
  # hashes served_model_name, so renaming the model starts a SECOND container instead of
  # replacing the first. The orphan held both the port and ~23 GB of loaded weights.
  # 8000/8080 are the two most squatted ports on any dev box; 8101 is not.
  port: 8101
  host: 0.0.0.0
  tensor_parallel: 1
  served_model_name: qwen38-27b
  max_model_len: 65536
  gpu_memory_utilization: 0.35
  kv_cache_bytes: 8589934592     # 8 GiB
  max_num_seqs: 4
  max_num_batched_tokens: 16384
  # native MTP; the checkpoint ships mtp.* weights.
  # NOTE: this is the WHOLE JSON blob on purpose, not just the number.
  # sparkrun substitutes with the regex `\{(.*?)\}` (vpd arg_substitute), which is
  # non-greedy and brace-blind: in `'{"method":"mtp","num_speculative_tokens":{spec_tokens}}'`
  # the first `{` pairs with the first `}`, so the match is the key
  # `"method":"mtp","num_speculative_tokens":{spec_tokens}` — no such default exists, the
  # whole thing is put back verbatim, and vLLM gets literal `{spec_tokens}`:
  #   JSONDecodeError: Expecting property name enclosed in double quotes (char 42)
  # vLLM then exits before binding the port and sparkrun reports only
  #   "Error: Server health check never passed at http://127.0.0.1:8101/v1/models"
  # A placeholder inside a JSON literal is unreachable. Keep the JSON in the value.
  # `attention_backend` inside this blob is NOT redundant with the --attention-backend
  # flag below. The Qwen3.5 MTP drafter builds its OWN attention selector and ignores
  # the target's choice: it picks FlashInfer, which then dies on the first prefill with
  # the 19-vs-20 argument `plan()` ABI mismatch of the published 0.6.15 JIT-cache wheel.
  # The server never reaches ready, so all you see is sparkrun's
  #   "Error: Server health check never passed"
  # Both places have to say triton_attn. This is what production runs.
  speculative_config: '{"method":"mtp","num_speculative_tokens":3,"attention_backend":"triton_attn"}'
  kv_cache_dtype: fp8
  # The refusal hook is configured ONLY through the VLLM_REFUSAL_* env below — the patched
  # vLLM reads env, not CLI flags, so there is nothing for defaults/command to carry.
  # MEASURED: with the drafter unprojected, acceptance is 3.00 on benign prompts but
  # 2.41 on refusal triggers at lambda=1 — a ~20% drop on exactly the topics you turn
  # the dial on for. The obvious explanation — target projected, drafter not, so it
  # proposes what the UNABLATED model would say — turns out NOT to be the cause:
  # `last`/`mean` project the drafter with a backbone direction. MEASURED, 3 reps: it does
  # NOT recover the gap (0.59 -> 0.55, noise; the benign column alone spans 0.39). The
  # control: at lambda=0 the projection is x0, so mean and off must be identical — they
  # measured 2.94 vs 2.84, which is this bench's noise floor. `off` reproduces the source
  # ablation exactly and mean buys nothing measurable.
  # (last == mean here anyway: all 128 directions are the same vector, cos >= 0.9996.)

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  # Without VLLM_REFUSAL_DIRS the hook is never constructed and the image is
  # byte-equivalent to its base. That is the rollback: unset this, restart.
  VLLM_REFUSAL_DIRS: /opt/refusal/refusal_dirs_qwen38.safetensors
  VLLM_REFUSAL_LAMBDA_INIT: "1.0"
  VLLM_REFUSAL_MTP_MODE: "off"

pre_exec:
  # Fail closed before serving: verifies the directions load, that every one of the 128
  # is claimed by a layer, and that the tool-argument whitespace fix is in effect.
  # A half-ablated model throws no error and only shows up if you measure refusal rate.
  - python3 /opt/qwen38/verify_qwen38_rank1.py

post_exec:
  - curl -s localhost:{port}/v1/models
  # MEASURED 2026-09-17 on image 20260815: VLLM_REFUSAL_LAMBDA_INIT is NOT honoured.
  # The var reaches every process incl. VLLM::EngineCore (verified via /proc/<pid>/environ)
  # and refusal_projection.py:429 does read it at hook construction, yet the server comes up
  # reporting lambda 0.0. So uncensored-by-default has to be set after readiness, here.
  # Braces are DOUBLED - sparkrun's arg substitution is brace-blind; {{ }} renders as { }.
  # Whole command is a SINGLE-QUOTED YAML scalar with '' escapes: the header's
  # "Content-Type: application/json" contains a colon+space, which YAML reads as a
  # mapping separator inside a plain scalar and refuses to parse.
  - 'curl -s -XPOST localhost:{port}/admin/refusal_lambda -H ''Content-Type: application/json'' -d ''{{"lambda": 1}}'''
  - curl -s localhost:{port}/admin/refusal_lambda

post_commands:
  - 'echo "ablation on:  curl -XPOST {head_host}:{port}/admin/refusal_lambda -d ''{{\"lambda\": 1}}''"'
  - 'echo "ablation off: curl -XPOST {head_host}:{port}/admin/refusal_lambda -d ''{{\"lambda\": 0}}''"'

# --attention-backend triton_attn is NOT optional on vLLM 0.25.2, and it has to be set
# TWICE: once here for the target model and once inside --speculative-config for the MTP
# drafter, which selects its backend independently. flashinfer starts fine, captures CUDA
# graphs, and then dies with `plan(): Mismatched number of arguments` — the signature does
# not match the Qwen3.5 full_attention path. On the target it only shows up if your smoke
# test sends a prompt; on the drafter it kills startup, so the only symptom is sparkrun's
# "Server health check never passed".
command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --max-model-len {max_model_len} \
    --kv-cache-dtype {kv_cache_dtype} \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --enable-auto-tool-choice \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_coder \
    --default-chat-template-kwargs '{"enable_thinking":false}' \
    --trust-remote-code \
    --attention-backend triton_attn \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-memory-bytes {kv_cache_bytes} \
    --speculative-config '{speculative_config}' \
    --limit-mm-per-prompt '{"image":16}' \
    -tp {tensor_parallel} \
    --host {host} \
    --port {port}

benchmark:
  framework: llama-benchy
  pp: [2048]
  depth: [0, 8192]
