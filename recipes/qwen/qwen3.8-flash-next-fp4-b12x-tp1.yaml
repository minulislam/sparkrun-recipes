# >>> Port of the user's hand-run `docker run eugr/spark-vllm-b12x:nightly-20261015` command (2026-11-17).
# >>> Flags, env and defaults are identical to @eugr/qwen3.8-flash-next-nvfp4-solo (registry searched first);
# >>>   that recipe uses the unpinned build alias `vllm-node-b12x`, this one pins the image the user ran.
# >>> Differences from the eugr recipe:
# >>>   1. container: eugr/spark-vllm-b12x:nightly-20261015 (user-specified, dated tag). IMAGE-POLICY tier 2:
# >>>      no spark-arena rebuild of this nightly exists yet, and eugr images carry no provenance labels.
# >>>   2. executor_config mirrors the docker flags the user ran: memlock/stack ulimits, seccomp and
# >>>      apparmor unconfined. sparkrun 0.4.2's default seccomp profile already allows io_uring
# >>>      (`--load-format b12x` needs it; that was the old rootless-seccomp failure), unconfined is
# >>>      kept only to match the user's working command.
# >>> NOT VERIFIED: image not pulled on either node and nvidia/Qwen3.8-Flash-Next-FP4-Local not downloaded.

recipe_version: "2"
model: nvidia/Qwen3.8-Flash-Next-FP4-Local
runtime: vllm
container: eugr/spark-vllm-b12x:nightly-20261015
min_nodes: 1
max_nodes: 1

readiness:
  port_timeout_s: 2400
  health_timeout_s: 2400
  inference_timeout_s: 600

executor_config:
  security_opt:
    - seccomp=unconfined
    - apparmor=unconfined
  ulimit:
    - memlock=-1:-1
    - stack=67108864:67108864
    - nofile=65535:65535

env:
  # Bound PyTorch CUDA reservation during A16 weight preparation on shared RAM (from the eugr recipe).
  PYTORCH_ALLOC_CONF: "per_process_memory_fraction:0.8"
  VLLM_PLE_TABLE_MEMORY: "disk"
  B12X_DISK_BACKEND: "io_uring"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_MXFP8_LM_HEAD: "1"
  VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE: "w13"
  VLLM_B12X_MOE_FP4_FORCE_A16: "1"
  B12X_W4A16_A4_PREFILL: "1"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 4096
  num_speculative_tokens: 4
  gpu_memory_utilization: 0.8

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size {block_size} \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --compilation-config '{"pass_config":{"fuse_act_quant":true}}' \
    --gpu-memory-utilization {gpu_memory_utilization}

metadata:
  description: >-
    Qwen3.8 Flash Next (nvidia FP4-Local, modelopt_mixed) on one DGX Spark with the B12X stack:
    b12x loader/MoE/linear/GDN kernels, PLE tables on disk, fp8 KV, native MTP x4, 262k context.
  maintainer: eugr (recipe) / nvidia (model) — pinned to the image the user ran
