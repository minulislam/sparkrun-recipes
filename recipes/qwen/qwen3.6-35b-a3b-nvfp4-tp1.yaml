# >>>   max_model_len 262144, correct answer, reasoning split into its own field (qwen3 parser).
# >>>   Single stream: 512 tokens in 6.8 s = 75.5 tok/s end-to-end. No benchmark ladder yet.
# >>> Source: https://github.com/MiaAI-Lab/Qwen3.6-35B-A3B-NVFP4-vLLM
# >>> 2026-11-17: repointed from unsloth/Qwen3.6-35B-A3B-NVFP4 (never downloaded here) to
# >>>   nvidia/Qwen3.6-35B-A3B-NVFP4, which is complete on both nodes (21.8 GiB). vLLM reads its
# >>>   modelopt NVFP4 config itself. gpu_memory_utilization 0.90 -> 0.80 (repo ceiling 0.82).

# =============================================================================
# sparkrun recipe — Qwen3.6-35B-A3B NVFP4 via vLLM   [MiaAI-Lab]
# SINGLE NODE (TP=1 / 1 GPU) on DGX Spark GB10.
# -----------------------------------------------------------------------------
# Model: unsloth/Qwen3.6-35B-A3B-NVFP4
# Source: https://github.com/MiaAI-Lab/Qwen3.6-35B-A3B-NVFP4-vLLM
# Container: vllm/vllm-openai:v0.24.0
# Runtime: vLLM | Context: 256k
# =============================================================================

recipe_version: "2"
model: nvidia/Qwen3.6-35B-A3B-NVFP4
model_revision: 1355db6a052410cfd62085d94b58866fd0f2c3c5
runtime: vllm
container: vllm/vllm-openai:v0.24.0
min_nodes: 1
max_nodes: 1

# The image bakes ENTRYPOINT ["vllm","serve"], which would swallow sparkrun's command.
executor_config:
  entrypoint: ""

metadata:
  description: >-
    NVIDIA Qwen3.6-35B-A3B NVFP4 via vLLM on single DGX Spark. 256k context.
    Recipe from MiaAI-Lab (written for the unsloth build).
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 35B
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.80
  max_model_len: 262144
  served_model_name: qwen3.6-35b-a3b-nvfp4

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --reasoning-parser qwen3 \
    --trust-remote-code
