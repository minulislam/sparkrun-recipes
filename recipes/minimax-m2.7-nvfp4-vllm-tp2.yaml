# >>> COPY of @official/minimax-m2.7-nvfp4-vllm (fetched 2026-09-27, per user request: include registry recipes for
# >>> models whose weights are on dgx-pair). Source content unchanged except where noted.
recipe_version: "2"
model: nvidia/MiniMax-M2.7-NVFP4
runtime: vllm
min_nodes: 2
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:20260927  # pinned from :latest 2026-09-28 — build already on disk, verified live

metadata:
  description: MiniMax-M2.7 NVFP4 (NVIDIA quant)

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  # MEASURED 2026-09-29: 0.85 sits at the edge of the head's unified pool — rank 0 aborted with
  # "Free memory on device cuda:0 (102.81/121.69 GiB) < desired (0.85=103.43 GiB)" on a launch
  # where only 102.81 GiB was free at profiler time. 0.82 (99.8 GiB) clears it with margin and
  # still leaves ~23 GiB KV (0.85 measured 26.57 GiB), ample for the 184k-token rung.
  gpu_memory_utilization: 0.82
  max_model_len: 196608
  # LOCAL ADDITION 2026-09-29: bound the per-chunk prefill transient for full-context runs.
  # Unbounded chunked prefill at depth is the measured node-killer on this pair (DeepSeek coder
  # livelocked the worker twice at 8192; 2048 is the value two recipes verified clean with).
  max_num_batched_tokens: 2048
  load_format: instanttensor
  tool_call_parser: minimax_m2
  reasoning_parser: minimax_m2

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  # LOCAL ADDITION 2026-09-29 (MEASURED): worker rank died at init with
  # "gloo/transport/tcp/device.cc:285 ss1.ss_family == ss2.ss_family. 2 vs 10" — the cluster
  # yaml pins GLOO/TP to enp1s0f1np1, but the HEAD's f1 ports are ipv4.method=auto with no
  # DHCP on the link, so their IPv4 vanishes on link events (worker's is static 10.99.10.11
  # -> family mismatch, IPv4 vs IPv6). enP7s7 = 10.10.20.x mgmt NIC, static IPv4 on BOTH
  # nodes and already the torch rendezvous interface. Control-plane only; NCCL data stays on
  # the RoCE HCA pins. Root fix for the operator: make the head's f1 ports static.
  GLOO_SOCKET_IFNAME: "enP7s7"
  TP_SOCKET_IFNAME: "enP7s7"
  # Same missing-IPv4 root cause one layer deeper (captured attempt 2): head rank dies at
  # ncclGetUniqueId with "NCCL error: invalid usage" because the cluster's
  # NCCL_SOCKET_IFNAME (f1 ports) has no IPv4 on the head. Bootstrap/OOB only —
  # bulk transfers stay on NCCL_IB_HCA (RoCE, IPv6 link-local GIDs work).
  NCCL_SOCKET_IFNAME: "enP7s7"
  NCCL_DEBUG: "WARN"
  # MEASURED 2026-09-29 (attempt 6, GID tables read from sysfs): the head's rocep1s0f1 has an
  # extra IPv6-LL GID pair, so its IPv4 RoCEv2 GID is at index 5 while the worker's is at
  # index 3. NCCL auto-selection pairs by index -> IPv6-LL vs IPv4 mismatch ->
  # "ibv_modify_qp failed with 22". Forcing family (not index) lets each node pick its own
  # IPv4 v2 GID. This is also why inkling's fixed GID_INDEX=3 works on the worker-style
  # table but would break the head.
  NCCL_IB_ADDR_FAMILY: "AF_INET"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  # MEASURED 2026-09-29 (attempts 3-5): while the head's f1 IPv4 is missing, the RDMA data
  # path is unfixable in software — RoCEv2 QP setup fails on BOTH nodes ("ibv_modify_qp
  # failed with 22 Invalid argument": no IPv4 GID on the head, IPv4-vs-IPv6-LL pairing
  # invalid) and TCP fallback is impossible because this image's NCCL routes all transport
  # init through its net plugin ("Failed to initialize any NET plugin" with NCCL_IB_DISABLE=1,
  # with or without NCCL_NET_PLUGIN=none). BLOCKED until the operator makes the head's f1
  # ports static (mirror the worker):
  #   sudo nmcli con modify "Wired connection 5" ipv4.method manual ipv4.addresses 10.99.10.10/24 && sudo nmcli con up "Wired connection 5"
  #   sudo nmcli con modify "Wired connection 4" ipv4.method manual ipv4.addresses 10.99.11.10/24 && sudo nmcli con up "Wired connection 4"
  # The three bootstrap pins above stay: they are correct either way and make rendezvous
  # immune to future f1 IPv4 loss.

command: |
  vllm serve {model} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --no-enable-flashinfer-autotune \
    --load-format {load_format} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --host {host} \
    --port {port}
# LOCAL ADDITION for dgx-pair: cold safetensors loads here take 6-30 min (measured across the
# 2026-09-27 fleet); sparkrun default readiness gives up first.
readiness:
  port_timeout_s: 2400
  health_timeout_s: 2400
  inference_timeout_s: 600
