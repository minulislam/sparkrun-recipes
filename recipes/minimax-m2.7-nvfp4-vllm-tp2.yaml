# >>> COPY of @official/minimax-m2.7-nvfp4-vllm (fetched 2026-09-27, per user request: include registry recipes for
# >>> models whose weights are on dgx-pair). Source content unchanged except where noted.
recipe_version: "2"
model: nvidia/MiniMax-M2.7-NVFP4
runtime: vllm
min_nodes: 2
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:20260927  # pinned from :latest 2026-09-28 — build already on disk, verified live

metadata:
  description: MiniMax-M2.7 NVFP4 (NVIDIA quant)

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 196608
  load_format: instanttensor
  tool_call_parser: minimax_m2
  reasoning_parser: minimax_m2

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

command: |
  vllm serve {model} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel} \
    --max-model-len {max_model_len} \
    --load-format {load_format} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --host {host} \
    --port {port}
# LOCAL ADDITION for dgx-pair: cold safetensors loads here take 6-30 min (measured across the
# 2026-09-27 fleet); sparkrun default readiness gives up first.
readiness:
  port_timeout_s: 2400
  health_timeout_s: 2400
  inference_timeout_s: 600
