# >>> UNVERIFIED — source: https://github.com/MiaAI-Lab/GLM-5.3-Flash-EXL3-2x-DGX-Sparks
# >>> Please test and run --dry-run first, then update with your verified launch facts.

# =============================================================================
# sparkrun recipe — GLM-5.3 Flash EXL3   [MiaAI-Lab]
# TWO NODES (TP=2 / 2 GPUs) on DGX Spark GB10 via Ray.
# -----------------------------------------------------------------------------
# Model: Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw (pinned revision)
# Source: https://github.com/MiaAI-Lab/GLM-5.3-Flash-EXL3-2x-DGX-Sparks
# Container: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks:exl3
# Context: 850k tokens | Runtime: Ray + vLLM | Modality: multimodal
# Notes: Multimodal GLM model with EXL3 quantization (4bpw target).
# =============================================================================

model: Mia-AiLab/GLM-5.3-Flash-EXL3-TR3-4bpw
model_revision: 25a44fdbf16862a46b7cc9921142c6c81350af2f
runtime: vllm-ray
container: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks:exl3
min_nodes: 2
max_nodes: 2

metadata:
  description: >-
    GLM-5.3 Flash EXL3 (4bpw target) multimodal on 2x DGX Spark —
    Ray TP=2, EXL3 quantization. 850k context.
    Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 92B
  model_dtype: exl3
  quantization: exl3
  quant_bits: 4

env:
  HF_TOKEN: "${HF_TOKEN:-}"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 2
  gpu_memory_utilization: 0.90
  max_model_len: 850000
  served_model_name: glm-5.3-flash-exl3
  enforce_eager: false

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --trust-remote-code
