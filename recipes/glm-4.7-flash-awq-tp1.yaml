# >>> COPY of @experimental/glm-4.7-flash-awq-vllm (eugr conversion) (fetched 2026-09-27, per user request: include registry recipes for
# >>> models whose weights are on dgx-pair). Source content unchanged except where noted.
recipe_version: "2"
model: cyankiwi/GLM-4.7-Flash-AWQ-4bit
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-tf5:2026092702  # pinned from :latest 2026-09-28 — tf5 mirrors main nightly, same manifest as :20260927

metadata:
  description: GLM-4.7-Flash-AWQ — cyankiwi AWQ quantized GLM-4.7-Flash

# This mod applied MLA patch, but doesn't apply after vllm 0.14.1
#mods:
#  - mods/fix-glm-4.7-flash-AWQ

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.7
  max_model_len: 202752
  max_num_batched_tokens: 4096
  max_num_seqs: 64
  tool_call_parser: glm47
  reasoning_parser: glm45

command: |
  vllm serve {model} \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --enable-auto-tool-choice \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    -tp {tensor_parallel} \
    --host {host} \
    --port {port}