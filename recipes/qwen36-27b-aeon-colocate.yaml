# =============================================================================
# sparkrun recipe — Qwen3.6-27B-AEON-Ultimate-Uncensored-NVFP4  [CO-LOCATION]
# Variant of qwen36-27b-aeon-ultimate-nvfp4.yaml tuned to SHARE one GB10 with a
# second model (e.g. gemma4-26b on the same head, different port):
#   gpu_memory_utilization 0.40 (~48 GB of 121) — weights ~30 GB, rest KV.
#   max_model_len 65536 — full 262K needs ~94 GB total, impossible at 0.40.
#   No DFlash — co-location wants predictable memory; add the drafter only if
#   the neighbor model is small.
# For solo full-context use, run the base recipe instead.
# -----------------------------------------------------------------------------
# History: consolidated 2026-07-25 from /home/devops/workspace/llm/recipes/
# qwen36-27b-aeon-toolcall.yaml (2026-07-09). Tool parsers are now also in the
# base recipe; this variant's remaining purpose is the co-location profile.
# Parser evidence: qwen3_xml verified live 2026-07-09 ('hermes' does NOT parse
# Qwen3.6's XML-style calls); qwen3_coder verified live 2026-07-25 (structured
# tool_calls + separated reasoning) — both work; qwen3_coder kept for
# consistency with the rest of the registry.
# Launch (second endpoint on the head, port 8001):
#   sparkrun run ./qwen36-27b-aeon-colocate.yaml --hosts 10.10.20.10 --tp 1 --port 8001 --no-follow
# =============================================================================

model: AEON-7/Qwen3.6-27B-AEON-Ultimate-Uncensored-NVFP4
runtime: vllm
# Digest = :2026-07-08-v0.24.0-maxsafe (vllm 0.24.0+aeon.sm121a.dflash); pin
# avoids sparkrun's ':latest' re-pull hang and silent upstream tag drift.
container: ghcr.io/aeon-7/aeon-vllm-ultimate@sha256:b47f2ce2e38ea7b8ff31714214344fdf40f693002b8e2ef2f534c3a3eaf9c996

# AEON image sets ENTRYPOINT ["/bin/bash"], which collides with sparkrun's
# 'bash -c <serve cmd>' container command (exit 126, verified 2026-07-08).
executor_config:
  entrypoint: ""

min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    Qwen3.6 27B hybrid (GatedDeltaNet + full attn), NVFP4, uncensored, tool
    calling enabled. CO-LOCATION profile: 0.40 GPU / 65K ctx to share one GB10
    with a second model. Use the base recipe for solo serving.
  maintainer: AEON-7 (model) — recipe adapted for sparkrun; co-location variant
  model_params: 27B
  model_dtype: nvfp4
  model_vram: 30

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  TORCH_MATMUL_PRECISION: "high"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_CACHE_ROOT: "/cache/huggingface/.vllm_cache"  # persists FlashInfer FP4 autotune across
                                                     # containers (~13 min cold -> ~2 min warm)

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.40
  max_model_len: 65536
  max_num_seqs: 32
  max_num_batched_tokens: 16384
  served_model_name: qwen36-27b-aeon

command: |
  vllm serve {model} \
      --served-model-name {served_model_name} \
      --host {host} \
      --port {port} \
      --tensor-parallel-size {tensor_parallel} \
      --dtype auto \
      --quantization compressed-tensors \
      --mamba-cache-dtype float32 \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-chunked-prefill \
      --enable-prefix-caching \
      --enable-auto-tool-choice \
      --tool-call-parser qwen3_coder \
      --reasoning-parser qwen3 \
      --trust-remote-code
