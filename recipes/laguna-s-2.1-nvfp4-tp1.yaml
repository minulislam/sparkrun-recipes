# >>> Please test and run --dry-run first, then update with your verified launch facts.

# =============================================================================
# sparkrun recipe — Poolside Laguna-S-2.1 NVFP4   [MiaAI-Lab]
# SINGLE NODE (TP=1 / 1 GPU) on DGX Spark GB10 / RTX 6000 PRO.
# -----------------------------------------------------------------------------
# Model: poolside/Laguna-S-2.1-NVFP4
# Source: https://github.com/MiaAI-Lab/Laguna-S-2.1-DGX-Spark-RTX-6000-PRO
# Container: vllm/vllm-openai:v0.25.1
# Runtime: vLLM | Context: 256k
# Notes: DFlash speculative decoding
# =============================================================================

recipe_version: "2"
model: poolside/Laguna-S-2.1-NVFP4
runtime: vllm
container: vllm/vllm-openai:v0.25.1
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    Poolside Laguna-S-2.1 NVFP4 via vLLM on single DGX Spark / RTX 6000 PRO —
    DFlash speculative decoding. Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 30B
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.90
  max_model_len: 262144
  served_model_name: laguna-s-2.1-nvfp4

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --trust-remote-code
