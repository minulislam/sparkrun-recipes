# >>> Please test and run --dry-run first, then update with your verified launch facts.

# =============================================================================
# sparkrun recipe — Qwen3.8-27B NVFP4 via SGLang   [MiaAI-Lab]
# SINGLE NODE (TP=1 / 1 GPU) on DGX Spark GB10.
# -----------------------------------------------------------------------------
# Model: RadixArk/Qwen3.8-27B-NVFP4
# Source: https://github.com/MiaAI-Lab/Qwen3.8-27B-SGLang-DGX-Spark
# Container: lmsysorg/sglang:qwen38-27b
# Runtime: SGLang | Context: 256k
# Notes: DFlash speculative decoding, 8 concurrent requests
# =============================================================================

recipe_version: "2"
model: RadixArk/Qwen3.8-27B-NVFP4
runtime: sglang
container: lmsysorg/sglang:qwen38-27b
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    RadixArk/Qwen3.8-27B-NVFP4 via SGLang on DGX Spark — NVFP4,
    DFlash speculative decoding, full 256K context, 8 concurrent requests.
    Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 27B
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.90
  max_model_len: 262144
  served_model_name: qwen3.8-27b-sglang

command: |
  python3 -m sglang.launch_server \
    --model-path {model} \
    --host {host} \
    --port {port} \
    --tp {tensor_parallel} \
    --mem-fraction-static 0.88 \
    --trust-remote-code
