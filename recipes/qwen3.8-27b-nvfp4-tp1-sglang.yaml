# sparkrun recipe: Qwen3.8-27B NVFP4 via SGLang on single DGX Spark (TP=1)
# Source: https://github.com/MiaAI-Lab/Qwen3.8-27B-SGLang-DGX-Spark
model: RadixArk/Qwen3.8-27B-NVFP4
runtime: sglang
container: lmsysorg/sglang:qwen38-27b
min_nodes: 1
max_nodes: 1
metadata:
  description: "RadixArk/Qwen3.8-27B-NVFP4 via SGLang on DGX Spark — NVFP4, DFlash speculative decoding, full 256K context"
  category: general
  model_params: 27000000000
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4
defaults:
  port: 8888
  tensor_parallel: 1
  gpu_memory_utilization: 0.9
  max_model_len: 262144
