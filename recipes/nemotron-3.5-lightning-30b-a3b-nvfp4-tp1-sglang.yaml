# >>> Please test and run --dry-run first, then update with your verified launch facts.

# =============================================================================
# sparkrun recipe — NVIDIA Nemotron 3.5 Lightning 30B-A3B NVFP4 via SGLang   [MiaAI-Lab]
# SINGLE NODE (TP=1 / 1 GPU) on DGX Spark GB10.
# -----------------------------------------------------------------------------
# Model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
# Source: https://github.com/MiaAI-Lab/Nemotron3.5-Lightning-DGX-Spark-RTX-5090-6000-PRO
# Container: lmsysorg/sglang:dev-nemotron3-5-lightning
# Runtime: SGLang | Context: 256k
# Notes: DSpark speculative decoding, RTX 5090/6000 PRO variant
# =============================================================================

recipe_version: "2"
model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
runtime: sglang
container: lmsysorg/sglang:dev-nemotron3-5-lightning
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    NVIDIA Nemotron 3.5 Lightning 30B-A3B NVFP4 + DSpark via SGLang on
    DGX Spark / RTX 5090 / RTX 6000 PRO. 256k context.
    Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 30B
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.90
  max_model_len: 262144
  served_model_name: nemotron-3.5-lightning

command: |
  sglang serve \
    --model-path {model} \
    --host {host} \
    --port {port} \
    --tp {tensor_parallel} \
    --mem-fraction-static 0.88 \
    --trust-remote-code
