# sparkrun recipe: NVIDIA Nemotron 3.5 Lightning 30B-A3B NVFP4 via SGLang on single DGX Spark (TP=1)
# Source: https://github.com/MiaAI-Lab/Nemotron3.5-Lightning-DGX-Spark-RTX-5090-6000-PRO
model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
runtime: sglang
container: lmsysorg/sglang:dev-nemotron3-5-lightning
min_nodes: 1
max_nodes: 1
metadata:
  description: "NVIDIA Nemotron 3.5 Lightning 30B-A3B NVFP4 + DSpark via SGLang on DGX Spark / RTX 5090 / RTX 6000 PRO"
  category: general
  model_params: 30000000000
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4
defaults:
  port: 8888
  tensor_parallel: 1
  gpu_memory_utilization: 0.9
  max_model_len: 262144
