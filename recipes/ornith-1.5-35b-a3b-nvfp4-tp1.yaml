# >>> Please test and run --dry-run first, then update with your verified launch facts.

# =============================================================================
# sparkrun recipe — Ornith-1.5-35B-A3B NVFP4   [MiaAI-Lab]
# SINGLE NODE (TP=1 / 1 GPU) on DGX Spark GB10.
# -----------------------------------------------------------------------------
# Model: spark-ai/Ornith-1.5-35B-A3B-NVFP4
# Source: https://github.com/MiaAI-Lab/Ornith-1.5-35B-A3B-DGX-Spark
# Container: eugr/spark-vllm-b12x:latest
# Runtime: vLLM | Context: 256k
# Notes: In-checkpoint MTP, b12x recipe, CUDA-graph fixes
# =============================================================================

model: spark-ai/Ornith-1.5-35B-A3B-NVFP4
runtime: vllm
container: eugr/spark-vllm-b12x:latest
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    Ornith-1.5-35B-A3B NVFP4 + in-checkpoint MTP on single DGX Spark —
    vLLM b12x recipe with CUDA-graph fixes. 256k context.
    Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 35B
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.90
  max_model_len: 262144
  served_model_name: ornith-1.5-35b

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --trust-remote-code
