# =============================================================================
# sparkrun recipe — Gemma-4-31B-it-DECKARD-HERETIC-Uncensored-NVFP4   [DENSE/QUALITY]
# SINGLE NODE on the head (10.10.20.10).
# -----------------------------------------------------------------------------
# Footprint: 20.5 GB disk / ~21 GB loaded   |   Context: 262K native, CAPPED to 64K here (KV limit)   |   Modality: text + vision
# Speed: SLOW on GB10 — ~12-14 tok/s single (pure dense 31B is bandwidth-bound;
#        ~43 tok/s with the E4B EAGLE drafter at low concurrency).
# Pick this only when full-dense answer quality matters more than speed.
# Launch:
#   sparkrun run ./gemma4-31b-deckard-heretic-nvfp4.yaml --cluster default --tp 1 --dry-run
#   sparkrun run ./gemma4-31b-deckard-heretic-nvfp4.yaml --cluster default --tp 1
# -----------------------------------------------------------------------------
# !! BLOCKED ON CONTAINER (verified on a live boot 2026-07-08): the unified AEON
#    image (vllm 0.24.0+aeon) REJECTS this checkpoint. hf_quant_config.json
#    declares quant_algo NVFP4_AWQ (ModelOpt 0.42.0, pre_quant_scale: true) but
#    this build supports only [FP8, FP8_PER_CHANNEL_PER_TOKEN, FP8_PB_WO, NVFP4,
#    W4A16_NVFP4, MXFP8, MIXED_PRECISION] -> VllmConfig validation fails at boot.
#    FIX: use the card's family image (vllm-spark-gemma4-nvfp4 — get the exact
#    tag from the card) or any vLLM build that lists NVFP4_AWQ. Do NOT hand-edit
#    quant_algo to W4A16_NVFP4: pre_quant_scale tensors could be silently
#    ignored -> silent quality corruption.
# !! VERIFY (https://huggingface.co/AEON-7/Gemma-4-31B-it-DECKARD-HERETIC-Uncensored-NVFP4):
#    - EAGLE spec-decode via drafter AEON-7/Gemma-4-E4B-DECKARD-HERETIC-Uncensored-NVFP4
#      is OPTIONAL and uses EAGLE (not DFlash) config — syntax unverified, see below.
# =============================================================================

model: AEON-7/Gemma-4-31B-it-DECKARD-HERETIC-Uncensored-NVFP4
runtime: vllm
container: ghcr.io/aeon-7/aeon-vllm-ultimate:latest    # FLAG: confirm tag per card

# AEON image sets ENTRYPOINT ["/bin/bash"], which collides with sparkrun's
# 'bash -c <serve cmd>' container command (exit 126, verified 2026-07-08).
executor_config:
  entrypoint: ""

min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    Gemma 4 31B DENSE, NVFP4 AWQ_FULL (ModelOpt), thinking + vision, uncensored
    (DECKARD/Heretic). Quality-critical pick; slow decode on GB10. Single DGX Spark.
  maintainer: AEON-7 (model) — recipe adapted for sparkrun
  model_params: 31B
  model_dtype: nvfp4
  model_vram: 21

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  TORCH_MATMUL_PRECISION: "high"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.75     # 0.85 caused NVRM out-of-memory during boot on the live GB10 (2026-07-08)
  max_model_len: 65536             # 262144 native does NOT fit: dense 60L x 16KV heads needs 240 GB KV at full
                                   # context. 65536 -> 60 GB KV + 21 GB weights = 81 GB, inside the 90.75 GB
                                   # budget at 0.75. vLLM refuses to boot if one max-len seq exceeds KV capacity.
  max_num_seqs: 16
  max_num_batched_tokens: 16384
  served_model_name: gemma4-31b-deckard

# Gemma 4 -> triton_attn + gemma4 parsers (verified pattern). ModelOpt NVFP4
# quant left to vLLM auto-detect.
command: |
  vllm serve {model} \
      --served-model-name {served_model_name} \
      --host {host} \
      --port {port} \
      --tensor-parallel-size {tensor_parallel} \
      --dtype auto \
      --attention-backend triton_attn \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-chunked-prefill \
      --enable-prefix-caching \
      --trust-remote-code \
      --enable-auto-tool-choice \
      --tool-call-parser gemma4 \
      --reasoning-parser gemma4

# --- OPTIONAL: EAGLE speculative decoding (confirm exact config from card) -----
#     pre-download the drafter first (the control machine IS the head, run locally):
#       huggingface-cli download AEON-7/Gemma-4-E4B-DECKARD-HERETIC-Uncensored-NVFP4
#     then add (EAGLE method/fields are model-specific — verify):
#       --speculative-config '{"method":"eagle","model":"AEON-7/Gemma-4-E4B-DECKARD-HERETIC-Uncensored-NVFP4","num_speculative_tokens":5}'
