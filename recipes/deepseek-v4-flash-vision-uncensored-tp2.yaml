# >>> UNVERIFIED on this cluster — source: https://huggingface.co/orcarouter/DeepSeek-V4-Flash-Vision-Uncensored
# >>> GATED — the HF account behind the token must have accepted the repo gate (see INDEX.md, orcarouter note).
# >>> Mirrors deepseek-v4-flash-vision-exp-tp2.yaml: this is a byte-for-byte drop-in for that base
# >>>   checkpoint (native FP4 experts / block-FP8 rest), abliteration baked into the same shards.
# >>> executor_config clears the image's baked ENTRYPOINT ["vllm","serve"], which otherwise swallows
# >>>   sparkrun's launcher (same fix as gemma4-26b-stock-vllm.yaml).
# >>> kv_cache_dtype fp8: DeepSeek-V4 uses the fp8_ds_mla KV layout; NVIDIA's model card marks
# >>>   --kv-cache-dtype fp8 as required for vLLM. Override with -o kv_cache_dtype=auto if rejected.
# >>> max_num_seqs / max_num_batched_tokens follow @official/deepseek-v4-flash-0731-b12x-dspark-vllm
# >>>   so startup doesn't profile and graph-capture batch sizes the KV budget can never serve.
# >>> Fit: 167.8 GB / 2 = ~84 GB per node, ~15 GB/node for KV at 0.82 (GB10 convention — see README).

model: orcarouter/DeepSeek-V4-Flash-Vision-Uncensored
model_revision: 2ef3d5c2bb7d9ccba6ab66314ed9e63bd52ac2a6   # HF commit as of 2026-09-03
runtime: vllm
container: ghcr.io/anemll/dspark-vllm-gx10:0.1.1
min_nodes: 2
max_nodes: 2

executor_config:
  entrypoint: ""

metadata:
  description: >-
    DeepSeek V4 Flash Vision uncensored/abliterated, native mixed checkpoint
    (FP4 MoE experts + FP8 rest). The collection ships no NVFP4 build. Tensor-parallel over 2 Sparks.
  maintainer: orcarouter (model) — recipe adapted for sparkrun
  model_dtype: fp4
  model_vram: 168

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 2
  gpu_memory_utilization: 0.82
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  kv_cache_dtype: fp8
  served_model_name: deepseek-v4-flash-vision-uncensored

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype {kv_cache_dtype} \
    --trust-remote-code
