# >>> VERIFIED 2026-09-26 on this cluster (sparkrun 0.3.10, eugr nightly d08775c4). Served end to end:
# >>>   full 1,048,576-token context, vision (image_url -> correct answer), tool calling (deepseek_v4
# >>>   parser), DSpark speculative decoding. ~57 tok/s single stream, weights load in 193 s, ready
# >>>   ~13 min after launch. Endpoint http://10.10.20.10:8000/v1.
# >>> GATED — the HF account behind the token must have accepted the repo gate (see INDEX.md).
# >>> Mirrors @eugr/deepseek-v4-flash-vision-exp: this checkpoint is a byte-for-byte drop-in for
# >>>   deepseek-ai/DeepSeek-V4-Flash-Vision-Exp (FP4 experts / block-FP8 rest, ViT + aligner + 3 DSpark
# >>>   blocks, abliteration baked into the same shards).
# >>> IMAGE IS NOT INTERCHANGEABLE: ghcr.io/anemll/dspark-vllm-gx10:0.1.1 has no DeepSeek-V4 vision code
# >>>   and dies on the checkpoint's `aligner.*` tensors ("no module or parameter named 'aligner'").
# >>>   The eugr b12x build ships vllm.models.deepseek_v4.common.vl_model
# >>>   (DeepseekV4ForConditionalGeneration) and maps the vision./aligner./image_ prefixes explicitly.
# >>> KV MUST BE fp8. -o kv_cache_dtype=nvfp4_ds_mla is accepted by argparse and then rejected at model
# >>>   init: "DeepseekV4 fp8_ds_mla layout only supports fp8 kv-cache". (MiaAI-Lab run 4-bit KV on the
# >>>   anemll image only by mounting ~40 hotfix patches, incl. fix-nvfp4-ds-mla-long-context.patch.)
# >>> NEEDS THE PAIR TO ITSELF. Measured: with a 33 GB co-tenant on the head node, vLLM's auto-fit
# >>>   collapsed the context from 1048576 to 576 tokens and every prompt >576 tokens 400'd — the server
# >>>   still came up and answered short prompts, so it looks healthy. Always read max_model_len back
# >>>   from /v1/models after launch. Clean node: 11.79 GiB KV -> 1,144,794 tokens (~10.8 KB/token).
# >>> reasoning_effort defaults to high, so short budgets return content:null with all tokens spent in
# >>>   the reasoning block. Give it >=600 max_tokens, or pass
# >>>   chat_template_kwargs {"reasoning_effort":"low"} per request (verified: 66 tokens, 1.0 s).
# >>> Fit: 167.8 GB / 2 = ~84 GB per node; at 0.82 vLLM consumed 84.78 GiB and kept 11.79 GiB for KV.

recipe_version: "2"
model: orcarouter/DeepSeek-V4-Flash-Vision-Uncensored
model_revision: 2ef3d5c2bb7d9ccba6ab66314ed9e63bd52ac2a6   # HF commit as of 2026-09-03
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-b12x:latest
min_nodes: 2
max_nodes: 2

metadata:
  description: >-
    DeepSeek V4 Flash Vision uncensored/abliterated (orcarouter), native FP4 experts / FP8 rest,
    vision-capable, in-checkpoint DSpark. b12x serving stack, tensor-parallel over 2 Sparks.
  maintainer: orcarouter (model) — recipe adapted for sparkrun
  model_dtype: fp4
  model_vram: 168

env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  VLLM_USE_B12X_MHC: "1"
  VLLM_USE_B12X_FP8_GEMM: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_MOE_SKIP_PADDING: "0"
  B12X_MLA_SM120_UNIFIED: "1"
  B12X_MOE_FORCE_A8: "1"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 2
  gpu_memory_utilization: 0.82
  max_model_len: auto
  block_size: 256
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  max_cudagraph_capture_size: 48
  num_speculative_tokens: 6
  kv_cache_dtype: fp8
  # safetensors, not b12x: the b12x loader reads shards through io_uring, which Docker's default
  # seccomp profile blocks in rootless containers ("io_uring bounce initialization failed:
  # Operation not permitted", measured 2026-09-26). safetensors costs nothing here — 3 shards in
  # 10 s, 193 s total model load. -o load_format=b12x only works if an operator widens security_opt.
  load_format: safetensors
  served_model_name: deepseek-v4-flash-vision-uncensored

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --kv-cache-dtype {kv_cache_dtype} \
    --block-size {block_size} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --tokenizer-mode deepseek_v4 \
    --tool-call-parser deepseek_v4 \
    --enable-auto-tool-choice \
    --reasoning-parser deepseek_v4 \
    --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
    --default-chat-template-kwargs.thinking=true \
    --default-chat-template-kwargs.reasoning_effort=high \
    --load-format {load_format} \
    --moe-backend b12x \
    --linear-backend b12x \
    --attention-backend B12X \
    --max-cudagraph-capture-size {max_cudagraph_capture_size} \
    --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}' \
    --speculative-config '{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic","attention_backend":"B12X"}'
