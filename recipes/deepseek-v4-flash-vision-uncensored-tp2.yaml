# >>> UNVERIFIED on this cluster — source: https://huggingface.co/orcarouter/DeepSeek-V4-Flash-Vision-Uncensored
# >>>   (orcarouter collection: DeepSeek V4 Flash Vision Uncensored / Abliterated)
# >>> GATED (auto-approve): open the model page above while logged in to the HF account
# >>>   whose token sparkrun uses and click "Agree and access repository" — until then
# >>>   every download returns 403.
# >>> Container and serve flags are mirrored from deepseek-v4-flash-vision-exp-tp2.yaml (the base-model
# >>> recipe in this repo, itself UNVERIFIED).
# >>> 2026-09-26 measured: ghcr.io/anemll/dspark-vllm-gx10:0.1.1 bakes ENTRYPOINT ["vllm","serve"],
# >>>   which swallows sparkrun's launcher command as its own args and never starts the server.
# >>>   Fixed below with executor_config.entrypoint: "". Launch then died on the actual model
# >>>   download: HF returns 403 (gated repo) even with the sparkrun token — needs a human to open
# >>>   the model page above while logged into that HF account and click "Agree and access repository".
# >>> Fit: 167.8 GB / 2 = ~84 GB per node; sparkrun dry-run estimates 15 GB/node left for KV at 0.82.
# >>> gpu_memory_utilization 0.82 follows this repo's GB10 convention (the Deckard recipe runs
# >>> here at 0.82; 0.85 has NVRM-OOMed at boot and 0.90 fails vLLM's free-memory check).

# =============================================================================
# sparkrun recipe — DeepSeek-V4-Flash-Vision-Uncensored
# TWO NODES (TP=2) on DGX Spark GB10.
# Model: orcarouter/DeepSeek-V4-Flash-Vision-Uncensored  (167.8 GB of weights)
# Runtime: vllm | Container: ghcr.io/anemll/dspark-vllm-gx10:0.1.1
# =============================================================================

model: orcarouter/DeepSeek-V4-Flash-Vision-Uncensored
model_revision: 2ef3d5c2bb7d9ccba6ab66314ed9e63bd52ac2a6   # HF commit as of 2026-09-03
runtime: vllm
container: ghcr.io/anemll/dspark-vllm-gx10:0.1.1
min_nodes: 2
max_nodes: 2

executor_config:
  entrypoint: ""

metadata:
  description: >-
    DeepSeek V4 Flash Vision uncensored/abliterated, native mixed checkpoint
    (FP4 MoE experts + FP8 rest). The collection ships no NVFP4 build. Tensor-parallel over 2 Sparks.
  maintainer: orcarouter (model) — recipe adapted for sparkrun
  model_dtype: fp4
  model_vram: 168

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 2
  gpu_memory_utilization: 0.82
  max_model_len: 262144
  served_model_name: deepseek-v4-flash-vision-uncensored

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --trust-remote-code
