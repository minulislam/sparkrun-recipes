# >>> Please test and run --dry-run first, then update with your verified launch facts.

# =============================================================================
# sparkrun recipe — Qwen3.6-27B NVFP4 via vLLM   [MiaAI-Lab]
# SINGLE NODE (TP=1 / 1 GPU) on DGX Spark GB10.
# -----------------------------------------------------------------------------
# Model: nvidia/Qwen3.6-27B-NVFP4
# Source: https://github.com/MiaAI-Lab/Qwen3.6-27B-NVFP4-vLLM
# Container: vllm/vllm-openai:nightly-ddd6fbca148a867aad1fcab7ec72f582b9977db4  # pinned 2026-09-28 — commit tag of local build; head/worker had diverged under the floating tag
# Runtime: vLLM | Context: 256k
# =============================================================================

recipe_version: "2"
model: nvidia/Qwen3.6-27B-NVFP4
runtime: vllm
container: vllm/vllm-openai:nightly-ddd6fbca148a867aad1fcab7ec72f582b9977db4  # pinned 2026-09-28 — commit tag of local build; head/worker had diverged under the floating tag
# 2026-09-27: official vllm-openai images bake ENTRYPOINT ["vllm","serve"]; sparkrun aborts with
# "declares ENTRYPOINT" (measured on this exact tag in qwen3.8-27b-nvfp4-tp1.yaml). Blank it.
executor_config:
  entrypoint: ""
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    NVIDIA Qwen3.6-27B NVFP4 via vLLM nightly on single DGX Spark. 256k context.
    Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 27B
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.90
  max_model_len: 262144
  served_model_name: qwen3.6-27b-nvfp4

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --trust-remote-code
