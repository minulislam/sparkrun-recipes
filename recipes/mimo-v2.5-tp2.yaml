# >>> Please test and run --dry-run first, then update with your verified launch facts.

# =============================================================================
# sparkrun recipe — Xiaomi MiMo-V2.5 vLLM   [MiaAI-Lab]
# TWO NODES (TP=2 / 2 GPUs) on DGX Spark GB10.
# -----------------------------------------------------------------------------
# Model: Xiaomi/MiMo-V2.5
# Source: https://github.com/MiaAI-Lab/MiMo-V2.5-vLLM-Dual-DGX-Sparks
# Container: ghcr.io/miaai-lab/mimo-v2.5-vllm-dual-dgx-sparks:base-20260620
# Runtime: vLLM (Ray) | Notes: Omni MTP1, NVFP4-KV
# =============================================================================

recipe_version: "2"
model: Xiaomi/MiMo-V2.5
runtime: vllm-ray
container: ghcr.io/miaai-lab/mimo-v2.5-vllm-dual-dgx-sparks:base-20260620
min_nodes: 2
max_nodes: 2

metadata:
  description: >-
    Xiaomi MiMo-V2.5 vLLM on 2x DGX Spark — Omni MTP1 + NVFP4-KV, TP=2.
    Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 72B
  model_dtype: bfloat16
  kv_dtype: nvfp4

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 2
  gpu_memory_utilization: 0.90
  served_model_name: mimo-v2.5

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --trust-remote-code
