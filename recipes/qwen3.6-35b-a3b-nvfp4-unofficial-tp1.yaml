# =============================================================================
# sparkrun recipe — Unsloth Qwen3.6-35B-A3B NVFP4 (b12x)   [MiaAI-Lab]
# SINGLE NODE (TP=1 / 1 GPU) on DGX Spark GB10.
# -----------------------------------------------------------------------------
# Model: unsloth/Qwen3.6-35B-A3B-NVFP4
# Source: https://github.com/MiaAI-Lab/Unsloth-Qwen3.6-35b-NVFP4-DGX-Spark
# Container: ghcr.io/miaai-lab/mia-vllm-gb10-linear-b12x:latest  # TODO: upstream publishes only :latest — no fixed tag exists (checked 2026-09-28)
# Runtime: vLLM | Context: 256k
# Notes: b12x linear attention recipe for GB10
# =============================================================================

recipe_version: "2"
model: unsloth/Qwen3.6-35B-A3B-NVFP4
runtime: vllm
container: ghcr.io/miaai-lab/mia-vllm-gb10-linear-b12x@sha256:19627342e1da2607f4db50745dca30e57d7dd0ebff06062f03fd69b43a252931  # pinned by digest 2026-10-01 — upstream publishes ONLY :latest (ghcr tag list confirms). Safe here: single-node recipe, so sparkrun 0.3.10's digest-ship defect on workers does not apply. Mirror to spark-arena when push creds exist.
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    Unsloth Qwen3.6-35B-A3B-NVFP4-Fast on single DGX Spark —
    vLLM b12x linear attention recipe. 256k context.
    Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 35B
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.90
  max_model_len: 262144
  served_model_name: qwen3.6-35b-b12x

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --trust-remote-code
