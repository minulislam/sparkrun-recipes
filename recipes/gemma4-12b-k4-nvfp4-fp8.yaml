# >>>   sparkrun run ./gemma4-12b-k4-nvfp4-fp8.yaml --cluster default --tp 1
# >>> Cluster is 'default' (head 10.10.20.10 gb10-spark + worker 10.10.20.11 gx10-spark); 'dgxlab' does NOT exist.
# >>> Global ssh.user=devops is set in ~/.config/sparkrun/config.yaml. '--solo' is deprecated -> use '--tp 1'.
# >>> Endpoint serves on the head: http://10.10.20.10:8000

# =============================================================================
# sparkrun recipe — Gemma-4-12B-it-AEON-Abliterated-K4-NVFP4-FP8   [SMALL/FAST]
# SINGLE NODE on the head (10.10.20.10).
# -----------------------------------------------------------------------------
# Footprint: 9.3 GB disk / ~10 GB loaded   |   Context: up to 262K   |   Modality: text + vision
# Speed: author's "smallest + fastest" pick; ~250+ tok/s @16 concurrency
# Quant: MLP -> NVFP4, attention kept FP8 (preserves reasoning).
# Launch:
#   sparkrun run ./gemma4-12b-k4-nvfp4-fp8.yaml --cluster default --tp 1 --dry-run
#   sparkrun run ./gemma4-12b-k4-nvfp4-fp8.yaml --cluster default --tp 1
# -----------------------------------------------------------------------------
# !! VERIFY (https://huggingface.co/AEON-7/Gemma-4-12B-it-AEON-Abliterated-K4-NVFP4-FP8):
#    - container tag (unified AEON image assumed).
#    - mixed NVFP4-MLP + FP8-attn quant -> left to vLLM auto-detect (no
#      --quantization). If it mis-detects, set the value the card specifies.
#    - Gemma 4 attention/parsers (triton_attn + gemma4) are carried over from the
#      verified 26B card (same Gemma 4 architecture) — confirm they apply here.
#    - Quality sibling: AEON-7/Gemma-4-12B-it-AEON-Abliterated-K4-FP8 (13 GB, near-lossless).
# =============================================================================

model: AEON-7/Gemma-4-12B-it-AEON-Abliterated-K4-NVFP4-FP8
runtime: vllm
# Digest = :2026-07-08-v0.24.0-maxsafe (vllm 0.24.0+aeon.sm121a.dflash) — live-
# validated with this recipe 2026-07-18 (21.7 tok/s single-stream). Digest pin
# avoids sparkrun's ':latest' re-pull hang and silent upstream tag drift.
container: ghcr.io/aeon-7/aeon-vllm-ultimate@sha256:b47f2ce2e38ea7b8ff31714214344fdf40f693002b8e2ef2f534c3a3eaf9c996

# The AEON image sets ENTRYPOINT ["/bin/bash"], which collides with sparkrun's
# own 'bash -c <serve cmd>' container command (docker concatenates them ->
# 'bash /usr/bin/bash -c ...' -> exit 126 "cannot execute binary file",
# reproduced live 2026-07-08). Empty string clears the image ENTRYPOINT.
executor_config:
  entrypoint: ""

min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    Gemma 4 12B dense, NVFP4 (MLP) + FP8 (attention), uncensored (K4 biprojection).
    Smallest + fastest pick. Single DGX Spark.
  maintainer: AEON-7 (model) — recipe adapted for sparkrun
  model_params: 12B
  model_dtype: nvfp4
  model_vram: 10

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  TORCH_MATMUL_PRECISION: "high"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_CACHE_ROOT: "/cache/huggingface/.vllm_cache"  # persists FlashInfer FP4 autotune across
                                                     # containers (~13 min cold -> ~2 min warm)

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.70     # 0.85 caused NVRM out-of-memory during boot on the live GB10 (2026-07-08):
                                   # unified memory is shared with OS + page cache + weight-loading transients
  max_model_len: 131072            # ~200K is the max that fits at gpu_mem 0.70; still 1.5x headroom over this default
  max_num_seqs: 64
  max_num_batched_tokens: 32768
  served_model_name: gemma4-12b-k4

# Gemma 4 needs triton_attn (heterogeneous head dims 256/512) + gemma4 parsers
# (verified on the 26B card). Mixed FP8/NVFP4 quant left to auto-detect.
command: |
  vllm serve {model} \
      --served-model-name {served_model_name} \
      --host {host} \
      --port {port} \
      --tensor-parallel-size {tensor_parallel} \
      --dtype auto \
      --attention-backend triton_attn \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-chunked-prefill \
      --enable-prefix-caching \
      --trust-remote-code \
      --enable-auto-tool-choice \
      --tool-call-parser gemma4 \
      --reasoning-parser gemma4
