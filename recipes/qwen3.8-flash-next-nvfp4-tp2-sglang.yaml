# >>> Please test and run --dry-run first, then update with your verified launch facts.

# =============================================================================
# sparkrun recipe — Qwen3.8-Flash-Next NVFP4 via SGLang   [MiaAI-Lab]
# TWO NODES (TP=2 / 2 GPUs) on DGX Spark GB10.
# -----------------------------------------------------------------------------
# Model: Mia-AiLab/Qwen3.8-Flash-Next-NVFP4
# Source: https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Dual-DGX-Sparks
# Runtime: SGLang | Context: 256k
# Notes: FP8 dense weights, SGLang native speculative decoding
# =============================================================================

recipe_version: "2"
model: Mia-AiLab/Qwen3.8-Flash-Next-NVFP4
runtime: sglang
min_nodes: 2
max_nodes: 2

metadata:
  description: >-
    Qwen3.8-Flash-Next NVFP4 via SGLang on 2x DGX Spark — FP8 dense,
    SGLang native speculative decoding. 256k context.
    Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 8B
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 2
  gpu_memory_utilization: 0.90
  max_model_len: 262144
  served_model_name: qwen3.8-flash-next-sglang

command: |
  python3 -m sglang.launch_server \
    --model-path {model} \
    --host {host} \
    --port {port} \
    --tp {tensor_parallel} \
    --mem-fraction-static 0.88 \
    --trust-remote-code
