# sparkrun recipe: Qwen3.8-Flash-Next NVFP4 via SGLang on 2x DGX Spark (TP=2)
# Source: https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Dual-DGX-Sparks
# This variant uses SGLang with FP8 dense weights and SGLang-native speculative decoding
model: Mia-AiLab/Qwen3.8-Flash-Next-NVFP4
runtime: sglang
min_nodes: 2
max_nodes: 2
metadata:
  description: "Qwen3.8-Flash-Next NVFP4 via SGLang on 2x DGX Spark — FP8 dense, SGLang speculative decoding"
  category: general
  model_params: 8000000000
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4
defaults:
  port: 8888
  tensor_parallel: 2
  gpu_memory_utilization: 0.9
  max_model_len: 262144
env:
  HF_TOKEN: "${HF_TOKEN:-}"
