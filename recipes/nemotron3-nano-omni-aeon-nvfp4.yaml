# =============================================================================
# sparkrun recipe — Nemotron-3-Nano-Omni-AEON-Ultimate-Uncensored-NVFP4   [OMNI]
# SINGLE NODE on the head (10.10.20.10).
# -----------------------------------------------------------------------------
# Footprint: ~22 GB disk / ~24 GB loaded   |   Context: 200K
# Modality: TEXT + IMAGE + AUDIO + VIDEO  (only audio-capable model in the set;
#           RADIO vision + Parakeet audio encoders kept BF16)
# Speed: ~71 tok/s single / ~242 chunks/s @8   |   Refusal: 0% (thinking mode)
# NOTE: set client max_tokens >= 1200 in thinking mode to avoid truncation artifacts.
# Launch:
#   sparkrun run ./nemotron3-nano-omni-aeon-nvfp4.yaml --cluster default --tp 1 --dry-run
#   sparkrun run ./nemotron3-nano-omni-aeon-nvfp4.yaml --cluster default --tp 1
# -----------------------------------------------------------------------------
# !! VERIFY (https://huggingface.co/AEON-7/Nemotron-3-Nano-Omni-AEON-Ultimate-Uncensored-NVFP4):
#    - container: report references a Nemotron-specific image
#      (ghcr.io/aeon-7/vllm-nemotron-omni-aeon-ultimate). Using the unified AEON
#      image as primary; if omni (audio/video) modalities fail to register,
#      switch to that family-specific image.
#    - quantization is ModelOpt-NVFP4 -> left to vLLM auto-detect (no --quantization
#      flag). If it mis-detects, add --quantization modelopt.
#    - audio/video input plumbing may need container-specific multimodal flags —
#      confirm from the card's serve example.
#    - reasoning/tool parser names (commented) — confirm.
# =============================================================================

model: AEON-7/Nemotron-3-Nano-Omni-AEON-Ultimate-Uncensored-NVFP4
runtime: vllm
# Digest = :2026-07-08-v0.24.0-maxsafe (vllm 0.24.0+aeon.sm121a.dflash) — live-
# validated with this recipe 2026-07-18 (265 tok/s @ 8-way). Digest pin avoids
# sparkrun's ':latest' re-pull hang and silent upstream tag drift.
container: ghcr.io/aeon-7/aeon-vllm-ultimate@sha256:b47f2ce2e38ea7b8ff31714214344fdf40f693002b8e2ef2f534c3a3eaf9c996

# AEON image sets ENTRYPOINT ["/bin/bash"], which collides with sparkrun's
# 'bash -c <serve cmd>' container command (exit 126, verified 2026-07-08).
executor_config:
  entrypoint: ""

min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    Nemotron-3 Nano Omni 30B-A3B (hybrid Mamba2 + MoE), NVFP4, any-to-any
    text/image/audio/video. Only audio-capable model. Single DGX Spark.
  maintainer: AEON-7 (model) — recipe adapted for sparkrun
  model_params: 30B          # ~3B active per token
  model_dtype: nvfp4
  model_vram: 24

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  TORCH_MATMUL_PRECISION: "high"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_CACHE_ROOT: "/cache/huggingface/.vllm_cache"  # persists FlashInfer FP4 autotune across
                                                     # containers (~13 min cold -> ~2 min warm)

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.70     # matches NVIDIA's own nemotron Spark recipe; 0.85 caused NVRM OOM on this GB10
  max_model_len: 200000
  max_num_seqs: 32
  max_num_batched_tokens: 16384
  served_model_name: nemotron3-omni

# ModelOpt NVFP4 -> rely on vLLM auto-detect (no --quantization). Mamba2 hybrid ->
# no Gemma triton_attn override.
command: |
  vllm serve {model} \
      --served-model-name {served_model_name} \
      --host {host} \
      --port {port} \
      --tensor-parallel-size {tensor_parallel} \
      --dtype auto \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-chunked-prefill \
      --enable-prefix-caching \
      --trust-remote-code

# --- OPTIONAL: parsers / explicit quant (confirm from card) -------------------
#     --quantization modelopt
#     --enable-auto-tool-choice --tool-call-parser nemotron --reasoning-parser nemotron
# --- OPTIONAL: cap multimodal items per prompt --------------------------------
#     --limit-mm-per-prompt image=4,audio=2,video=1
