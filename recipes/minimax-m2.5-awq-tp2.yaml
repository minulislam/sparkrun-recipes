# >>> COPY of @experimental/minimax-m2.5-awq-vllm (eugr conversion) (fetched 2026-09-27, per user request: include registry recipes for
# >>> models whose weights are on dgx-pair). Source content unchanged except where noted.
recipe_version: "2"
model: cyankiwi/MiniMax-M2.5-AWQ-4bit
runtime: vllm
min_nodes: 2
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:20260927  # pinned from :latest 2026-09-28 — build already on disk, verified live

metadata:
  description: MiniMax-M2.5-AWQ — AWQ quantized MiniMax M2.5

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.7
  max_model_len: 128000
  load_format: fastsafetensors
  tool_call_parser: minimax_m2
  reasoning_parser: minimax_m2

command: |
  vllm serve {model} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    -tp {tensor_parallel} \
    --max-model-len {max_model_len} \
    --load-format {load_format} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --host {host} \
    --port {port}
# LOCAL ADDITION for dgx-pair: cold safetensors loads here take 6-30 min (measured across the
# 2026-09-27 fleet); sparkrun default readiness gives up first.
readiness:
  port_timeout_s: 2400
  health_timeout_s: 2400
  inference_timeout_s: 600
