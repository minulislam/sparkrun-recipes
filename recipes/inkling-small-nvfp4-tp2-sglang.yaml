# sparkrun recipe: Inkling-Small NVFP4 via SGLang on 2x DGX Spark (TP=2)
# Source: https://github.com/MiaAI-Lab/Inkling-Small-NVFP4-Dual-DGX-Sparks
model: thinkingmachines/Inkling-Small-NVFP4
runtime: sglang
min_nodes: 2
max_nodes: 2
metadata:
  description: "Thinking Machines Inkling-Small NVFP4 via SGLang on 2x DGX Spark — DSpark speculative decoding, fp4_mx_block16 KV"
  category: general
  model_params: 7000000000
  model_dtype: nvfp4
  kv_dtype: fp4_mx_block16
  quantization: nvfp4
  quant_bits: 4
defaults:
  port: 8888
  tensor_parallel: 2
  gpu_memory_utilization: 0.9
