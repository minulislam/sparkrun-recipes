# =============================================================================
# sparkrun recipe — Qwen3.6-35B-A3B-heretic-NVFP4  [BATCH / THROUGHPUT VARIANT]
# SINGLE NODE. Drafterless twin of qwen36-35b-a3b-heretic-nvfp4.yaml.
# -----------------------------------------------------------------------------
# WHY THIS VARIANT EXISTS (measured 2026-07-18 vs 2026-07-25, same model+image):
#   with DFlash n=11:  82 tok/s single-stream, 148.6 tok/s 8-way aggregate
#   drafterless:      43.4 tok/s single-stream, 224   tok/s 8-way aggregate
# Speculative decoding wins latency but LOSES ~34% aggregate at concurrency —
# draft/verify overhead compounds under batching. Pick per lane:
#   interactive lane -> qwen36-35b-a3b-heretic-nvfp4.yaml (DFlash)
#   batch/fleet lane -> THIS file (no spec decode, higher max_num_seqs)
# This drafterless config IS the 2026-07-18-benchmarked configuration (43.4 c=1,
# 224 @ 8-way, 21.9 GiB, KV 3.07M tokens) — numbers in
# benchmarks/BENCHMARKS-2026-07-18.md. Parsers added since (boot-verified).
# =============================================================================

recipe_version: "2"
model: AEON-7/Qwen3.6-35B-A3B-heretic-NVFP4
runtime: vllm
# Digest = :2026-07-08-v0.24.0-maxsafe (vllm 0.24.0+aeon.sm121a.dflash); pin
# avoids sparkrun's ':latest' re-pull hang and silent upstream tag drift.
container: ghcr.io/aeon-7/aeon-vllm-ultimate@sha256:b47f2ce2e38ea7b8ff31714214344fdf40f693002b8e2ef2f534c3a3eaf9c996

# AEON image sets ENTRYPOINT ["/bin/bash"], which collides with sparkrun's
# 'bash -c <serve cmd>' container command (exit 126, verified 2026-07-08).
executor_config:
  entrypoint: ""

min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    Qwen3.6 35B-A3B MoE (~3B active), NVFP4 compressed-tensors — BATCH variant:
    no speculative decoding, tuned for aggregate throughput (224 tok/s @ 8-way
    measured). Use the non-batch DFlash twin for interactive lanes.
  maintainer: AEON-7 (model) — recipe adapted for sparkrun
  model_params: 35B          # ~3B active per token
  model_dtype: nvfp4
  model_vram: 22

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  TORCH_MATMUL_PRECISION: "high"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.75     # 0.85 caused NVRM OOM on the live GB10 (2026-07-08)
  max_model_len: 262144
  max_num_seqs: 128                # batch lane: 2x the interactive twin (KV 3.07M tokens = 11.7x
                                   # concurrency at full 262K context — headroom is not the limit)
  max_num_batched_tokens: 32768
  served_model_name: qwen36-35b-a3b-batch

command: |
  vllm serve {model} \
      --served-model-name {served_model_name} \
      --host {host} \
      --port {port} \
      --tensor-parallel-size {tensor_parallel} \
      --dtype auto \
      --quantization compressed-tensors \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-chunked-prefill \
      --enable-prefix-caching \
      --trust-remote-code \
      --enable-auto-tool-choice \
      --tool-call-parser qwen3_coder \
      --reasoning-parser qwen3
