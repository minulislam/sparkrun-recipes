# >>>   because the worker's enP7s7 mgmt link was down; recipe itself is address-agnostic).
# >>>   Context: /v1/models reports max_model_len 850000. Boot ~8 min warm (466-541 s).
# >>>   Ladder (llama-benchy quick, pp2048/tg128, 3 runs/cell):
# >>>     c=1: 13.5 tok/s (d0), 13.3 (d8k), 13.2 (d32k) — flattest at-depth decode in the fleet.
# >>>     8-way aggregate: 20.5 (d0), 15.8 (d8k), 11.2 (d32k).
# >>>     Prefill c=1: 984 (d0), 535 (d8k), 419 (d32k) tok/s.
# >>>     Raw: benchmarks/results_glm53-flash-exl3-tp2.{json,csv}.
# >>>   Needle: 12/12 PASS — all 3 positions at 2k/32k/131k, centre at 262k/524k/800k *requested*
# >>>     depths = 162,315 / 324,573 / 495,234 actual prompt tokens (225.8 s at 495k; sequential
# >>>     prefill ~2.1-2.7k tok/s at depth). Proven bar: 495k of the 850k window.
# >>>   Refusal eval (JBB-Behaviors, 100 harmful + 100 benign, thinking off, c=4): 100/100 harmful
# >>>     and 100/100 benign complied, 0 refusals, 0 errors. Keyword grader.
# >>>   Coding: HumanEval pass@1 87.2% (143/164), thinking off, sandboxed exec (--network none).
# >>>   Engine alive after the full suite; head low-water 7 GiB, worker 10 GiB available.
# >>>   NOT measured: vision, tool calls, GSM8K/MMLU, prompts beyond 495k, soak beyond ~3.5 h.
# >>> REQUIRES mods/glm53-exl3-gb10-topk. The prebuilt :exl3 image (2026-09-07) lacks upstream's
# >>>   overlay edit that disables GB10 persistent_topk; without the mod the engine dies on the
# >>>   first ~32k-token decode: "persistent_topk would oversubscribe and the FilteredTopK
# >>>   fallback requires >=128KB smem" (libtorch_stable/topk.cu). The mod makes the same one-line
# >>>   edit as upstream overlay/patch_glm_video_placeholders.py::_disable_gb10_persistent_topk.
