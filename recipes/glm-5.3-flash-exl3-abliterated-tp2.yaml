# sparkrun recipe: GLM-5.3 Flash EXL3 (Abliterated) on 2x DGX Spark (TP=2)
# Source: https://github.com/MiaAI-Lab/GLM-5.3-Flash-EXL3-2x-DGX-Sparks
recipe_version: "2"
model: bullerwins/GLM-5.3-Flash-exl3-4bpw-ablit
runtime: vllm
container: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks:exl3
min_nodes: 2
max_nodes: 2

mods:
  - mods/glm53-exl3-gb10-topk

executor_config:
  entrypoint: ""
  user: root
  shm_size: 32gb

readiness:
  port_timeout_s: 3600
  health_timeout_s: 3600
  inference_timeout_s: 600

metadata:
  description: "GLM-5.3 Flash EXL3 4bpw Abliterated on 2x DGX Spark — multimodal, MP TP=2, uncensored o_proj"
  category: multimodal
  model_params: 92000000000
  model_dtype: exl3
  quantization: exl3
  quant_bits: 4
  kv_dtype: fp8

env:
  HF_TOKEN: "${HF_TOKEN:-}"
  GLM53_MODEL_PRESET: "abliterated"
  ABLIT: "0"
  QUANTIZATION: "exl3"
  KV_CACHE_DTYPE: "fp8"
  EXL3_FUSED_MOE: "1"
  EXL3_FAT_KERNEL: "1"
  EXL3_FAT_GROUPED: "1"
  GLM53_DENSE_FP8: "all"
  GLM53_KDA_BF16_LARGE_M: "1"
  GLM53_INDEXER_WORKSPACE: "rightsize"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  VLLM_NO_USAGE_STATS: "1"
  DO_NOT_TRACK: "1"

defaults:
  port: 8888
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 850000
  max_num_seqs: 4
  max_num_batched_tokens: 7168
  kv_cache_dtype: fp8
  kv_cache_memory_bytes: 15032385536
  quantization: exl3
  distributed_executor_backend: mp
  enforce_eager: true
  chat_template: /opt/glm53/chat_template.jinja
  served_model_name: bullerwins/GLM-5.3-Flash-exl3-4bpw-ablit

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host 0.0.0.0 \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --distributed-executor-backend {distributed_executor_backend} \
    --quantization {quantization} \
    --kv-cache-dtype {kv_cache_dtype} \
    --kv-cache-memory-bytes {kv_cache_memory_bytes} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --reasoning-parser glm45 \
    --enable-prefix-caching \
    --no-enable-flashinfer-autotune \
    --enable-prompt-tokens-details \
    --chat-template {chat_template} \
    --limit-mm-per-prompt '{"image":48,"video":1}' \
    --mm-processor-kwargs '{"max_image_tokens":2048}' \
    --mm-processor-cache-gb 1 \
    --skip-mm-profiling \
    --enforce-eager

