# >>> Please test and run --dry-run first, then update with your verified launch facts.

# =============================================================================
# sparkrun recipe — Qwen3.8-27B NVFP4 via vLLM (RadixArk variant)   [MiaAI-Lab]
# SINGLE NODE (TP=1 / 1 GPU) on DGX Spark GB10 / RTX 5090.
# -----------------------------------------------------------------------------
# Model: RadixArk/Qwen3.8-27B-NVFP4
# Source: https://github.com/MiaAI-Lab/Qwen3.8-27B-NVFP4-RTX-5090
# Runtime: vLLM | Context: 256k | Notes: RTX 5090 variant
# =============================================================================

recipe_version: "2"
model: RadixArk/Qwen3.8-27B-NVFP4
runtime: vllm
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    RadixArk Qwen3.8-27B NVFP4 via vLLM on single DGX Spark / RTX 5090 —
    native 256k ceiling. Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 27B
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.90
  max_model_len: 262144
  served_model_name: qwen3.8-27b-nvfp4-radix

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --trust-remote-code
