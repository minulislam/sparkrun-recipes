# >>> Please test and run --dry-run first, then update with your verified launch facts.

# =============================================================================
# sparkrun recipe — Hy3-295B NVFP4 W4A16   [MiaAI-Lab]
# TWO NODES (TP=2 / 2 GPUs) on DGX Spark GB10.
# -----------------------------------------------------------------------------
# Model: kodelow/Hy3-NVFP4-W4A16
# Source: https://github.com/MiaAI-Lab/Hy3-Dual-DGX-Spark
# Container: ghcr.io/miaai-lab/hy3-dual-dgx-spark:vllm-probe-modded
# Runtime: vLLM (Ray) | Notes: 295B MoE, tool calling
# =============================================================================

recipe_version: "2"
model: kodelow/Hy3-NVFP4-W4A16
runtime: vllm-ray
container: ghcr.io/miaai-lab/hy3-dual-dgx-spark:vllm-probe-modded
min_nodes: 2
max_nodes: 2

metadata:
  description: >-
    KodeloW Hy3-295B NVFP4 W4A16 via vLLM on 2x DGX Spark — TP=2, tool calling.
    Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 295B
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 2
  gpu_memory_utilization: 0.90
  served_model_name: hy3-295b

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --trust-remote-code
