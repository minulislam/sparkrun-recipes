# =============================================================================
# sparkrun recipe — Qwen3.8-27B-Uncensored-NVFP4
# SINGLE NODE (TP=1) on DGX Spark GB10.
# Model: orcarouter/Qwen3.8-27B-Uncensored-NVFP4  (24.7 GB of weights)
# Runtime: vllm | Container: vllm/vllm-openai:nightly-aarch64
# =============================================================================

model: orcarouter/Qwen3.8-27B-Uncensored-NVFP4
model_revision: 69d21348b2d6c11439fb69368f40414c2256e44e   # HF commit as of 2026-08-27
runtime: vllm
container: vllm/vllm-openai:nightly-aarch64
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    Qwen3.8 27B uncensored/abliterated, NVFP4 compressed-tensors, vision-capable
    (image-text-to-text). Single DGX Spark.
  maintainer: orcarouter (model) — recipe adapted for sparkrun
  model_params: 27B
  model_dtype: nvfp4
  model_vram: 25

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.82
  max_model_len: 262144
  served_model_name: qwen3.8-27b-uncensored

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --trust-remote-code
