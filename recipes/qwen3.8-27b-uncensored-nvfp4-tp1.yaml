# >>> UNVERIFIED on this cluster — source: https://huggingface.co/orcarouter/Qwen3.8-27B-Uncensored-NVFP4
# >>> GATED (auto-approve): the saved HF token still gets HTTP 403 on this repo (checked 2026-09-20).
# >>>   Open the model page while logged in as the token's account and click "Agree and access
# >>>   repository", then: hf download orcarouter/Qwen3.8-27B-Uncensored-NVFP4   (~25 GB)
# >>> 2026-09-20 rewrite: container switched from vllm/vllm-openai:nightly-aarch64 (not present on
# >>>   either node) to the eugr b12x nightly that IS cached on both nodes; serve flags mirror
# >>>   @official/qwen3.8-27b-fp8-mtp-vllm (instanttensor load, fp8 KV, flashinfer, native MTP x3).
# >>>   If the abliterated checkpoint lacks MTP heads, launch with: -o speculative_config='{}'
# >>>   and drop --speculative-config from the command.
# >>> Fit: ~25 GB weights on one GB10; 0.82 leaves ~74 GB for KV (this repo's GB10 convention;
# >>>   0.85 has NVRM-OOMed at boot here, 0.90 fails vLLM's free-memory check).

model: orcarouter/Qwen3.8-27B-Uncensored-NVFP4
model_revision: 69d21348b2d6c11439fb69368f40414c2256e44e   # HF commit as of 2026-08-27
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-b12x:latest
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    Qwen3.8 27B uncensored/abliterated (orcarouter), NVFP4, vision-capable.
    Single DGX Spark, native MTP speculative decoding.
  maintainer: orcarouter (model) — recipe adapted for sparkrun
  model_params: 27B
  model_dtype: nvfp4
  kv_dtype: fp8
  model_vram: 25

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.82
  max_model_len: 262144
  max_num_batched_tokens: 16384
  load_format: instanttensor
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  mm_encoder_tp_mode: data
  speculative_config: '{"method": "mtp", "num_speculative_tokens": 3}'
  served_model_name: qwen3.8-27b-uncensored

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --mm-encoder-tp-mode {mm_encoder_tp_mode} \
    --speculative-config '{speculative_config}' \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --enable-prefix-caching \
    --trust-remote-code
