# =============================================================================
# sparkrun recipe — DeepSeek-V4-Flash   [MiaAI-Lab]
# TWO NODES (TP=2 / 2 GPUs) on DGX Spark GB10.
# -----------------------------------------------------------------------------
# Model: deepseek-ai/DeepSeek-V4-Flash — MoE reasoning model
# Source: https://github.com/MiaAI-Lab/DeepSeek-v4-Flash-0731-vLLM-Dual-DGX-Sparks
# Context: 1M tokens | Runtime: vLLM | Modality: text | KV dtype: FP8
# =============================================================================

model: deepseek-ai/DeepSeek-V4-Flash
runtime: vllm

min_nodes: 2
max_nodes: 2

metadata:
  description: >-
    DeepSeek V4 Flash MoE on 2x DGX Spark via vLLM. TP=2, FP8 KV cache,
    1M token context. MoE reasoning model validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 236B
  model_dtype: bfloat16
  kv_dtype: fp8_e5m2
  quantization: fp8
  quant_bits: 8

env:
  HF_TOKEN: "${HF_TOKEN:-}"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 2
  gpu_memory_utilization: 0.90
  max_model_len: 1048576
