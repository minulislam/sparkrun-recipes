# >>> COPY of @experimental/openai-gpt-oss-120b-vllm (eugr conversion) (fetched 2026-09-27, per user request: include registry recipes for
# >>> models whose weights are on dgx-pair). Source content unchanged except where noted.
recipe_version: "2"
model: openai/gpt-oss-120b
runtime: vllm
max_nodes: 1
container: sparkarena/spark-vllm-docker:mxfp4  # only tag upstream publishes besides :latest; no dated tags exist (checked 2026-09-28)

metadata:
  description: OpenAI GPT-OSS 120B — MXFP4 quantization with FlashInfer (single node)

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.8
  max_num_batched_tokens: 8192
  load_format: fastsafetensors
  kv_cache_dtype: fp8
  tool_call_parser: openai
  reasoning_parser: openai_gptoss

env:
  VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8: "1"

command: |
  vllm serve {model} \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --enable-auto-tool-choice \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --load-format {load_format} \
    --quantization mxfp4 \
    --mxfp4-backend CUTLASS \
    --mxfp4-layers moe,qkv,o,lm_head \
    --attention-backend FLASHINFER \
    --kv-cache-dtype {kv_cache_dtype} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --host {host} \
    --port {port}
# LOCAL ADDITION for dgx-pair: cold safetensors loads here take 6-30 min (measured across the
# 2026-09-27 fleet); sparkrun default readiness gives up first.
readiness:
  port_timeout_s: 2400
  health_timeout_s: 2400
  inference_timeout_s: 600
