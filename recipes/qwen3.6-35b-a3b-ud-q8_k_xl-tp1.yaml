# >>> Please test and run --dry-run first, then update with your verified launch facts.

# =============================================================================
# sparkrun recipe — Qwen3.6-35B-A3B UD-Q8_K_XL GGUF via llama-server   [MiaAI-Lab]
# SINGLE NODE (TP=1 / 1 GPU) on DGX Spark GB10.
# -----------------------------------------------------------------------------
# Model: Local GGUF file — pre-download and place on NFS/shared storage.
#   Set model: to the absolute path of your GGUF file.
#   Example: model: /nfs/models/Qwen3.6-35B-A3B-UD-Q8_K_XL-Q8_K_XL.gguf
# Source: https://github.com/MiaAI-Lab/Qwen3.6-35B-A3B-UD-Q8_K_XL_DGX-Spark-Recipe
# Container: ghcr.io/spark-arena/dgx-llama-cpp:latest
# Runtime: llama-cpp | Notes: GGUF Q8_K_XL, requires local GGUF weights on NFS
# =============================================================================

model: /path/to/your/Qwen3.6-35B-A3B-UD-Q8_K_XL-Q8_K_XL.gguf
runtime: llama-cpp
container: ghcr.io/spark-arena/dgx-llama-cpp:latest
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    Qwen3.6-35B-A3B UD-Q8_K_XL GGUF via llama-server on DGX Spark.
    ⚠️ Requires local GGUF weights on NFS/shared storage. Set the model path
    to the absolute path of your GGUF file. Source-validated by MiaAI-Lab.
  maintainer: MiaAI-Lab (https://github.com/MiaAI-Lab)
  model_params: 35B
  model_dtype: int8
  quantization: gguf_q8_k_xl
  quant_bits: 8

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  n_gpu_layers: 999
  ctx_size: 262144
  served_model_name: qwen3.6-35b-gguf

command: |
  llama-server \
    -hf {model} \
    --host {host} \
    --port {port} \
    --n-gpu-layers {n_gpu_layers} \
    --ctx-size {ctx_size} \
    --flash-attn on \
    --jinja \
    --no-webui
