# >>> UNFIT ON dgx-pair (MEASURED 2026-09-27, fleet passes 6-7) — DO NOT RUN with the current image.
# >>>   Root cause: this checkpoint keeps the per-layer-embedding table in bf16 (the 102 GB shard);
# >>>   with the mandatory VLLM_PLE_TABLE_MEMORY=ram (io_uring is blocked, see env:) that maps
# >>>   47.68 GiB per rank of host memory, which on GB10 is the SAME unified pool vLLM's profiler
# >>>   measures. Fixed non-KV cost per rank ≈ 93 GiB (39.4 weights + 47.7 PLE + runtime):
# >>>     - util 0.40: both ranks load, profiler reports "Available KV cache memory: -44.5 GiB".
# >>>     - util 0.50: worker rank host-OOMs during load (earlyoom, RSS 51 GiB, node livelocked 50 min).
# >>>     - util 0.81 (needed for ~5 GiB of KV): worker rank dies in init before the gloo barrier.
# >>>   There is no utilization that both survives startup and buys any KV.
# >>>   Escape paths: (a) a checkpoint with the PLE table quantized to nvfp4 — the base
# >>>   local-inference-lab model is exactly that and is VERIFIED at 51.4 GiB/node
# >>>   (qwen3.8-flash-next-nvfp4-tp2.yaml); (b) run the container with io_uring allowed
# >>>   (custom seccomp profile) so VLLM_PLE_TABLE_MEMORY=disk works; (c) TP>2.
# >>> Original header follows.
# >>> UNVERIFIED on this cluster — source: https://huggingface.co/orcarouter/Qwen3.8-Flash-Next-Uncensored-NVFP4
# >>> GATED — the HF account behind the token must have accepted the repo gate (see INDEX.md, orcarouter note).
# >>> env + flags mirror @eugr/qwen3.8-flash-next-nvfp4-cluster (the config eugr runs for the base NVFP4
# >>>   on 2 Sparks), except --quantization is left to auto-detect: orcarouter ships compressed-tensors
# >>>   NVFP4, not modelopt_mixed. If the b12x MoE/linear backends reject it:
# >>>   -o moe_backend=auto -o linear_backend=auto
# >>> Fit (corrected 2026-09-26 from the on-disk config, not an estimate): 183.5 GB / 2 = ~92 GB per
# >>>   node, and the FULL 262,144 native context costs only ~1.6 GB/node of KV — so it runs at native
# >>>   length, no cap needed. The earlier "capped at 65536, ~7 GB/node for KV" note was wrong: this is
# >>>   a hybrid model (12 qwen_sparse_attention + 36 linear_attention of 48 layers) and only the 12
# >>>   sparse-attention layers hold per-token KV, giving 12.0 KB/token, not the 48.0 KB/token
# >>>   sparkrun's estimator assumes by counting all 48 layers. Expect `--dry-run` to overstate KV ~4x
# >>>   for every hybrid-attention model (Qwen3.8/3.6 Flash-Next family).
# >>> 262,144 IS the native context (max_position_embeddings) — this model is not 1M; DeepSeek-V4 is.

recipe_version: "2"
model: orcarouter/Qwen3.8-Flash-Next-Uncensored-NVFP4
model_revision: c1209bda15a6bbc4c68b585e93d40c0d85f50306   # HF commit as of 2026-08-29
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-b12x:latest
min_nodes: 2
max_nodes: 2

metadata:
  description: >-
    Qwen3.8 Flash Next uncensored/abliterated (orcarouter), NVFP4, vision-capable.
    vLLM tensor-parallel across both DGX Sparks, native MTP speculative decoding.
  maintainer: orcarouter (model) — recipe adapted for sparkrun
  model_dtype: nvfp4
  model_vram: 184

env:
  # MEASURED 2026-09-27: even with the safetensors loader the engine died in WorkerProc init —
  # "io_uring initialization failed: Operation not permitted" from b12x/sequence/_shared/disk_table.py
  # via qwen4_exp/nvidia/b12x_ple.py: the per-layer-embedding (PLE) table defaults to a disk-backed
  # io_uring row cache, which rootless Docker's seccomp forbids. VLLM_PLE_TABLE_MEMORY selects
  # device | ram | disk; "ram" = CUDA-mapped host memory (the same unified pool on GB10), no io_uring.
  VLLM_PLE_TABLE_MEMORY: "ram"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 2
  # MEASURED 2026-09-27: this checkpoint stores the per-layer-embedding table in bf16 (no
  # ple_embedding_dtype in config.json; it is the 102 GB model-00002 shard). With
  # VLLM_PLE_TABLE_MEMORY=ram vLLM maps 47.68 GiB per rank of HOST memory for it — outside vLLM's
  # GPU budget but inside the same 121 GB unified pool. 0.82 × 121 GiB + 47.7 GiB does not fit;
  # 0.50 leaves ~40 GB weights + ~20 GB KV (≈1.6M tokens at 12 KB/token) + the PLE table ≈ 108 GB.
  gpu_memory_utilization: 0.50
  max_model_len: 262144   # native; ~1.6 GB/node of KV (hybrid attn, 12 of 48 layers cache)
  max_num_seqs: 8
  kv_cache_dtype: fp8
  max_num_batched_tokens: 4096
  block_size: 16
  moe_backend: b12x
  linear_backend: b12x
  # MEASURED 2026-09-27: `--load-format b12x` dies in WorkerProc init with "io_uring initialization
  # failed: Operation not permitted" — rootless Docker's default seccomp blocks io_uring. Same fix as
  # the DeepSeek-V4 recipes: the plain safetensors loader (slower cold load, identical serving).
  load_format: safetensors
  num_speculative_tokens: 4
  served_model_name: qwen3.8-flash-next-uncensored

command: |
  vllm serve {model} \
    --revision {model_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --hf-overrides '{"text_config":{"layer_types":["linear_attention","linear_attention","linear_attention","full_attention","linear_attention","linear_attention","linear_attention","full_attention","linear_attention","linear_attention","linear_attention","full_attention","linear_attention","linear_attention","linear_attention","full_attention","linear_attention","linear_attention","linear_attention","full_attention","linear_attention","linear_attention","linear_attention","full_attention","linear_attention","linear_attention","linear_attention","full_attention","linear_attention","linear_attention","linear_attention","full_attention","linear_attention","linear_attention","linear_attention","full_attention","linear_attention","linear_attention","linear_attention","full_attention","linear_attention","linear_attention","linear_attention","full_attention","linear_attention","linear_attention","linear_attention","full_attention"]}}' \
    --tensor-parallel-size {tensor_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype {kv_cache_dtype} \
    --block-size {block_size} \
    --load-format {load_format} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}' \
    --gdn-decode-kernel b12x \
    --linear-backend {linear_backend} \
    --moe-backend {moe_backend} \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --compilation-config '{"pass_config":{"fuse_act_quant":true}}' \
    --gpu-memory-utilization {gpu_memory_utilization}
