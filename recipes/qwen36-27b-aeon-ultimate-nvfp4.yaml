# >>> VERIFIED LAUNCH (host + cluster facts re-verified live 2026-07-08 on head gb10-spark):
# >>>   sparkrun run ./qwen36-27b-aeon-ultimate-nvfp4.yaml --cluster default --tp 1
# >>> Cluster is 'default' (head 10.10.20.10 gb10-spark + worker 10.10.20.11 gx10-spark); 'dgxlab' does NOT exist.
# >>> Global ssh.user=devops is set in ~/.config/sparkrun/config.yaml. '--solo' is deprecated -> use '--tp 1'.
# >>> Endpoint serves on the head: http://10.10.20.10:8000

# =============================================================================
# sparkrun recipe — Qwen3.6-27B-AEON-Ultimate-Uncensored-NVFP4   [FLAGSHIP]
# SINGLE NODE on the head (10.10.20.10).
# -----------------------------------------------------------------------------
# Footprint: 26 GB disk / ~30 GB loaded (+3.3 GB DFlash drafter)   |   Modality: text + vision
# Speed: ~9.5-10.5 tok/s drafterless (measured 2026-07-18); 38-56 tok/s with
#        DFlash per AEON's category A/B on GB10.
# Refusal: 0/100 ("DGX Spark production-validated"). KL <=0.001 vs BF16.
# Launch:
#   sparkrun run ./qwen36-27b-aeon-ultimate-nvfp4.yaml --cluster default --tp 1 --dry-run
#   sparkrun run ./qwen36-27b-aeon-ultimate-nvfp4.yaml --cluster default --tp 1
#   curl http://10.10.20.10:8000/v1/models
# -----------------------------------------------------------------------------
# 2026-07-25: fixes applied from the AEON-7 GitHub cross-check
# (benchmarks/AEON-FINDINGS-2026-07-18.md):
#   - DFlash ENABLED: drafter z-lab/Qwen3.6-27B-DFlash (3.3 GB, 5-layer SWA),
#     num_speculative_tokens 10 (their n-sweep optimum; n=12 is crash-correlated
#     via Torch-Inductor device-side asserts). Drafter attention backend left
#     default per AEON. BF16 KV required — NEVER add --kv-cache-dtype here.
#   - Parsers verified: --reasoning-parser qwen3 --tool-call-parser qwen3_coder.
#   - --mamba-cache-dtype float32 (GDN recurrent state; raises acceptance);
#     leave --mamba-block-size unset.
#   - Dead env VLLM_NVFP4_GEMM_BACKEND removed (deleted upstream in v0.24.0).
#     This checkpoint auto-selects CUTLASS; do NOT force --linear-backend
#     flashinfer_cutlass (crashes checkpoints without per-input global scales)
#     and do NOT force Marlin (card: CUTLASS beats Marlin on GB10).
#   - ALTERNATIVE body (untried here): AEON's benchmarked Spark path is the 21 GB
#     …-Multimodal-NVFP4-MTP-XS sibling (--quantization modelopt) + DFlash —
#     ~18% better TPOT in their A/B than this heavy body.
# =============================================================================

model: AEON-7/Qwen3.6-27B-AEON-Ultimate-Uncensored-NVFP4
runtime: vllm
# Digest = :2026-07-08-v0.24.0-maxsafe (vllm 0.24.0+aeon.sm121a.dflash), the build
# all 2026-07-18 benchmarks ran on. Digest pin avoids sparkrun's ':latest' re-pull
# hang AND silent upstream tag drift (AEON has re-pointed dated tags before).
container: ghcr.io/aeon-7/aeon-vllm-ultimate@sha256:b47f2ce2e38ea7b8ff31714214344fdf40f693002b8e2ef2f534c3a3eaf9c996

# AEON image sets ENTRYPOINT ["/bin/bash"], which collides with sparkrun's
# 'bash -c <serve cmd>' container command (exit 126, verified 2026-07-08).
executor_config:
  entrypoint: ""

min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    Qwen3.6 27B hybrid (GatedDeltaNet + full attn), NVFP4 compressed-tensors,
    uncensored 0/100, vision-preserved, DFlash speculative decoding.
    Flagship quality pick. Single DGX Spark.
  maintainer: AEON-7 (model) — recipe adapted for sparkrun
  model_params: 27B
  model_dtype: nvfp4
  kv_dtype: bfloat16    # DFlash (non-causal drafter) requires BF16 KV
  model_vram: 33        # GB loaded incl. drafter; overrides auto-detect

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  TORCH_MATMUL_PRECISION: "high"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_USE_FLASHINFER_SAMPLER: "1"                   # per AEON's DFlash repo serve config
  VLLM_CACHE_ROOT: "/cache/huggingface/.vllm_cache"  # persists FlashInfer FP4 autotune across
                                                     # containers (~13 min cold -> ~2 min warm);
                                                     # lives inside sparkrun's HF cache mount

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.80      # 0.85 caused NVRM OOM on the live GB10 (2026-07-08)
  max_model_len: 131072             # was 262144, which needed 94 of the 96.8 GB budget at 0.80 —
                                    # the DFlash drafter (+3.3 GB weights + its KV) erases that
                                    # headroom. Run -o max_model_len=262144 only with the
                                    # --speculative-config line removed.
  max_num_seqs: 32
  max_num_batched_tokens: 32768     # AEON serve config (was 16384)
  served_model_name: qwen36-27b-aeon

command: |
  vllm serve {model} \
      --served-model-name {served_model_name} \
      --host {host} \
      --port {port} \
      --tensor-parallel-size {tensor_parallel} \
      --dtype auto \
      --quantization compressed-tensors \
      --mamba-cache-dtype float32 \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-chunked-prefill \
      --enable-prefix-caching \
      --trust-remote-code \
      --enable-auto-tool-choice \
      --tool-call-parser qwen3_coder \
      --reasoning-parser qwen3 \
      --speculative-config '{"method":"dflash","model":"z-lab/Qwen3.6-27B-DFlash","num_speculative_tokens":10}'
