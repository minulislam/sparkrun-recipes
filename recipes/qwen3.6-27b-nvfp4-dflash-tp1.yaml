# sparkrun recipe: Qwen3.6-27B NVFP4 with DFlash on single DGX Spark (TP=1)
# Source: https://github.com/MiaAI-Lab/Qwen3.6-27B-NVFP4-DFlash-DGX-Spark
model: nvidia/Qwen3.6-27B-NVFP4
runtime: vllm
container: vllm/vllm-openai:nightly-aarch64
min_nodes: 1
max_nodes: 1
metadata:
  description: "NVIDIA Qwen3.6-27B NVFP4 with DFlash speculative decoding on DGX Spark"
  category: general
  model_params: 27000000000
  model_dtype: nvfp4
  quantization: nvfp4
  quant_bits: 4
defaults:
  port: 8888
  tensor_parallel: 1
  gpu_memory_utilization: 0.9
  max_model_len: 262144
