# =============================================================================
# sparkrun recipe — Qwen3.8-Flash-Next-Uncensored-NVFP4
# TWO NODES (TP=2) on DGX Spark GB10.
# Model: orcarouter/Qwen3.8-Flash-Next-Uncensored-NVFP4  (183.5 GB of weights)
# Runtime: sglang | Container: sglang runtime default (template pins none)
# =============================================================================

model: orcarouter/Qwen3.8-Flash-Next-Uncensored-NVFP4
model_revision: c1209bda15a6bbc4c68b585e93d40c0d85f50306   # HF commit as of 2026-08-29
runtime: sglang
min_nodes: 2
max_nodes: 2

metadata:
  description: >-
    Qwen3.8 Flash Next uncensored/abliterated, NVFP4, vision-capable, served by
    SGLang tensor-parallel over 2 Sparks.
  maintainer: orcarouter (model) — recipe adapted for sparkrun
  model_dtype: nvfp4
  model_vram: 184

env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 2
  gpu_memory_utilization: 0.82
  max_model_len: 262144
  served_model_name: qwen3.8-flash-next-uncensored

command: |
  python3 -m sglang.launch_server \
    --model-path {model} \
    --revision {model_revision} \
    --host {host} \
    --port {port} \
    --tp {tensor_parallel} \
    --mem-fraction-static {gpu_memory_utilization} \
    --context-length {max_model_len} \
    --served-model-name {served_model_name} \
    --trust-remote-code
