# GLM-5.3-Flash-NVFP4-Spark — patched for the local dgx-pair cluster.
# Derived from @eugr/glm-5.3-flash. Two fixes: a context length that fits the
# per-node memory budget, and a container image that actually exists here.

recipe_version: "2"
description: vLLM serving local-inference-lab/GLM-5.3-Flash-NVFP4-Spark on a dual DGX Spark cluster

model: local-inference-lab/GLM-5.3-Flash-NVFP4-Spark
runtime: vllm-distributed
container: vllm-node

min_nodes: 2
max_nodes: 2

mods: []

metadata:
  description: >-
    GLM 5.3 Flash (Glm5NextForConditionalGeneration, NVFP4 modelopt_mixed) across
    two DGX Spark GB10 nodes at TP=2, using the in-image b12x serving stack with
    MTP speculative decoding.
  maintainer: Spark Studio local recipe
  quantization: nvfp4
  # Measured from the safetensors headers: 145.34 GB packed-U8 NVFP4
  # + 24.90 GB FP8_E4M3 + 4.50 GB BF16. Pinned because dtype-based
  # inference mis-sizes this mixed-precision checkpoint in both directions.
  model_vram: 174.73
  kv_dtype: fp8
  num_layers: 45
  kv_lora_rank: 512

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  decode_context_parallel: 1
  block_size: 256
  kv_cache_dtype: fp8
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  num_speculative_tokens: 5
  kv_cache_memory_bytes: 8G
  gpu_memory_utilization: 0.87

env:
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_ENABLE_PCIE_ALLREDUCE: "0"
  B12X_POLICY_MODE: "auto"
  INSTANTTENSOR_BACKEND: "BUFFERED"
  INSTANTTENSOR_BUFFER_SIZE: "67108864"
  INSTANTTENSOR_CHUNK_SIZE: "8388608"
  INSTANTTENSOR_CONCURRENCY: "1"
  INSTANTTENSOR_IO_DEPTH: "3"

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --decode-context-parallel-size {decode_context_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype {kv_cache_dtype} \
    --quantization modelopt_mixed \
    --attention-backend B12X \
    --block-size {block_size} \
    --moe-backend b12x \
    --linear-backend b12x \
    --no-enable-flashinfer-autotune \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"moe_backend":"humming","attention_backend":"B12X"}' \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --kv-cache-memory-bytes {kv_cache_memory_bytes} \
    --gpu-memory-utilization {gpu_memory_utilization}
